name: Serveur Nodefony (banc d'intégration)
description: >-
  Démarre le serveur du banc et attend qu'il soit PRÊT (ou l'arrête), en passant
  par le lanceur DU framework. Existe parce qu'un banc d'intégration a parfois
  besoin de deux décors successifs : recopier le lanceur pour le second, c'est
  garantir qu'un jour l'un des deux corrigera un défaut que l'autre gardera.

# POURQUOI cette action ne lance plus rien elle-même
#
# Elle recopiait le travail du framework : spawn détaché à la main, readiness par
# `grep` sur le journal (« 4× Server Listen on »), arrêt par `kill -9` sur un pid
# suivi d'un filet `lsof`. Trois recopies, et trois raisons de s'en défaire :
#
#  1. Elles étaient POSIX de bout en bout. `lsof` n'existe pas sous Windows, un
#     `kill -9` sur un pid seul n'y emporte pas l'arbre, et il n'y a pas de groupes
#     de process. Cette action était donc le seul obstacle qui empêchait la tâche
#     d'intégration — la SEULE du dépôt qui démarre un serveur et lui parle — de
#     s'ouvrir aux trois systèmes. Tout ce qui vit à l'exécution, pipeline HTTP,
#     WebSocket, cycle de vie, arrêt, n'était donc éprouvé que sur Linux.
#  2. Le framework porte DÉJÀ chacune de ces trois choses, et mieux : la readiness
#     lit les ports RÉELS publiés par le runtime (`runtime.json`) au lieu de
#     compter des lignes de journal — un décompte qui ment dès qu'une application
#     déclare un autre nombre de serveurs ; l'arrêt passe par l'implémentation
#     UNIQUE du kill d'arbre (`signalProcessGroup`, `taskkill /T /F` sous Windows)
#     et sait retrouver un runtime par son fichier d'état là où `ps` n'existe pas.
#  3. Depuis `10c6d556`, cette readiness REFUSE un boot dégradé et nomme les
#     modules manquants. Un banc qui démarre à la main n'en profitait pas : il
#     mesurait une application amputée en croyant mesurer l'application.
#
# Ce que l'action garde en propre : le décor (variables de CE serveur), la preuve
# qu'une route RÉPOND vraiment, et la remontée du journal.

inputs:
  action:
    description: "`start` (démarre et attend la readiness) ou `stop` (arrête l'arbre)."
    required: false
    default: start
  mode:
    description: >-
      Arguments passés au binaire — `production` ou `development --no-watch`.
      Le mode n'est PAS déduit ici : l'appelant sait pourquoi il veut l'un ou
      l'autre, et cette raison doit rester lisible dans le workflow.
    required: false
    default: development --no-watch
  log-file:
    description: Journal du serveur. Deux décors successifs = deux journaux distincts.
    required: false
    default: nodefony-server.log
  env:
    description: >-
      Variables `CLÉ=valeur`, une par ligne, posées pour CE serveur seulement.
      Passées explicitement plutôt qu'héritées : c'est ce qui distingue les deux
      décors, ça doit se lire dans l'appel.
    required: false
    default: ""
  node-args:
    description: >-
      Arguments passés à `node` AVANT le binaire — `--expose-gc` typiquement.
      Ils ne peuvent pas transiter par `NODE_OPTIONS`, que Node refuse pour ce
      drapeau. Sans `--expose-gc`, la sonde mémoire du module de test est un
      no-op silencieux et le banc mesure le déchet en attente de collecte au
      lieu du heap retenu. Ils SUIVENT le runtime détaché (`childExecArgv`).
    required: false
    default: ""
  health-url:
    description: >-
      URL à interroger pour prouver qu'une route répond vraiment. Des ports qui
      écoutent ne prouvent pas qu'une requête aboutit.
    required: false
    default: https://127.0.0.1:5152/nodefony/test/index

runs:
  using: composite
  steps:
    - name: Démarrer et attendre la readiness
      if: inputs.action == 'start'
      shell: bash
      env:
        NF_CI_MODE: ${{ inputs.mode }}
        NF_CI_LOG: ${{ inputs.log-file }}
        NF_CI_ENV: ${{ inputs.env }}
        NF_CI_NODE_ARGS: ${{ inputs.node-args }}
      run: |
        # Variables propres à CE décor, avant tout lancement.
        while IFS= read -r line; do
          [ -z "${line// }" ] && continue
          export "${line?}"
          echo "décor: ${line%%=*} posé"
        done <<< "$NF_CI_ENV"

        # Découpage en MOTS, jamais une variable nue : un argument qui contient un
        # espace ne doit pas se scinder en deux, et une liste vide ne doit pas
        # devenir un argument vide.
        read -ra NODE_ARGS <<< "$NF_CI_NODE_ARGS"
        read -ra MODE_ARGS <<< "$NF_CI_MODE"

        # Le binaire construit, invoqué par `node` : `node_modules/.bin/nodefony`
        # n'existe pas toujours (le bin est un artefact de build, absent à l'heure
        # du `npm ci`) et n'existe JAMAIS sous Windows autrement qu'en `.cmd`, que
        # Node refuse de lancer. Le script, lui, est le même partout.
        BIN=node_modules/nodefony/bin/nodefony

        if node "${NODE_ARGS[@]}" "$BIN" "${MODE_ARGS[@]}" \
             --detach --wait 120 --log "$NF_CI_LOG"; then
          echo "── état du runtime"
          node "$BIN" status || true
          # Une dégradation n'est pas un crash : le serveur écoute, mais des
          # fonctions ont pu se désactiver. Le dire sans mentir sur sa nature.
          if grep -q "CRITIC" "$NF_CI_LOG" 2>/dev/null; then
            echo "::warning::Le serveur écoute, mais a signalé des CRITIC — des fonctions sont peut-être DÉSACTIVÉES :"
            grep "CRITIC" "$NF_CI_LOG" | tail -10
          fi
        else
          code=$?
          echo "::error::Le runtime n'a pas atteint la readiness (code $code)"
          echo "── journal complet"
          cat "$NF_CI_LOG" 2>/dev/null || echo "(aucun journal à $NF_CI_LOG)"
          exit "$code"
        fi

    - name: Une route RÉPOND vraiment
      if: inputs.action == 'start'
      shell: bash
      env:
        NF_CI_HEALTH: ${{ inputs.health-url }}
        NF_CI_LOG: ${{ inputs.log-file }}
      run: |
        # Des ports qui écoutent ne prouvent pas qu'une requête aboutit : il faut
        # le routage, le module qui porte la route, et la chaîne TLS.
        for i in $(seq 1 10); do
          if curl -sk -o /dev/null -w "%{http_code}" "$NF_CI_HEALTH" | grep -q "200"; then
            echo "✅ $NF_CI_HEALTH → 200"
            exit 0
          fi
          sleep 1
        done
        echo "::error::$NF_CI_HEALTH n'a jamais rendu 200"
        tail -40 "$NF_CI_LOG" 2>/dev/null || true
        exit 1

    - name: Arrêter
      if: inputs.action == 'stop'
      shell: bash
      run: |
        # L'arrêt du framework : kill d'ARBRE par l'implémentation unique (le
        # serveur a des enfants — Vite, workers — qu'un `kill` sur le seul pid
        # laisserait vivants, tenant les ports pour le décor suivant), attente de
        # la mort EFFECTIVE, purge du fichier d'état. Idempotent : rien à arrêter
        # n'est pas une erreur.
        node node_modules/nodefony/bin/nodefony stop
