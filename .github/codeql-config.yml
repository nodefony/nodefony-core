---
# CodeQL Configuration — nodefony-core
#
# Excludes paths that are not production code to reduce noise and focus alerts
# on meaningful security findings in the actual codebase.
#
# Documentation: https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-github-actions/customizing-code-scanning

# ─── Suite de requêtes ────────────────────────────────────────────────────────
#
# `security-extended` plutôt que la suite `default` : Nodefony est PUBLIÉ sur
# npm, donc la surface d'attaque n'est pas ce dépôt mais les applications qui
# l'installent. La suite étendue ajoute les requêtes de précision moindre —
# injections indirectes, flux de données traversant plusieurs modules — qui sont
# exactement celles qu'un framework doit voir, et qu'un service isolé peut se
# permettre d'ignorer.
#
# `security-and-quality` n'est PAS retenue : elle ajoute des requêtes de STYLE,
# dont le dépôt a déjà les gardes (oxlint, prettier, typecheck strict). Le bruit
# qu'elle apporterait se paierait sur la seule liste qu'on veut garder lisible.
#
# ⚠️ Déclaré ICI et non dans le workflow : le champ `queries:` de
# `codeql-action/init` ÉCRASE celui d'un fichier de config au lieu de s'y
# ajouter (sauf préfixe `+`). Une seule source, donc, et c'est ce fichier.
#
# Preuve que le changement MORD : le journal du run compte les requêtes
# chargées (`[N/89] Loaded …` avec la suite par défaut). Sous `security-extended`
# ce total augmente — s'il reste à 89, la suite n'a pas été prise en compte.
queries:
  - uses: security-extended

paths-ignore:
  # Generated/dist directories
  - "**/dist/**"
  - "**/node_modules/**"

  # Temporary and build artifacts
  - "tmp/**"
  - "examples/**/dist/**"

  # Test coverage reports
  - "**/coverage/**"
  - ".coverage/**"

  # Generated files (config, types)
  - "**/*.generated.*"

  # Benchmarks and framework comparison suites (not production code)
  - ".claude/skills/**/bench-frameworks/**"

  # ─── Suites de tests ──────────────────────────────────────────────────────
  #
  # Pourquoi les exclure, alors qu'on ne retire jamais une garde de gaieté de
  # cœur : 114 des 144 alertes ouvertes venaient de là, et 108 disaient la même
  # chose — `rejectUnauthorized: false` face au certificat auto-signé du serveur
  # de banc. C'est le geste JUSTE dans un test (valider une autorité qui n'existe
  # pas rendrait le banc impossible), et il n'y a aucune surface d'attaque
  # derrière : ces fichiers ne s'exécutent pas en production et ne sont pas
  # publiés sur npm.
  #
  # Le coût du bruit n'est pas théorique : 144 alertes dont personne ne lit
  # aucune valent strictement moins que 30 qu'on peut traiter. Une liste qu'on
  # renonce à ouvrir est une liste qui ne garde plus rien.
  #
  # Ce que cette exclusion ne couvre PAS, et qui reste couvert ailleurs : un
  # secret en dur dans un test relève de l'analyse de secrets (`gitleaks`), pas
  # de CodeQL. Et la seule exception qui compte — un test qui désactive une
  # validation pour de MAUVAISES raisons — se voit à la relecture du diff, pas
  # dans un tableau de bord qu'on a cessé de regarder.
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
