# Banc de release — éprouve ce qu'un installeur RECEVRA. Ne publie rien.
#
# Ce fichier remplace le gabarit `npm-publish-github-packages.yml` d'origine,
# qui n'a jamais tourné et n'aurait pas pu : il faisait `npm publish` sur le
# paquet racine, déclaré `"private": true`, et visait GitHub Packages alors que
# Nodefony publie N paquets verrouillés sur npm. Un workflow qui ne peut pas
# fonctionner occupe l'inventaire en donnant l'illusion d'une couverture.
#
# 🔴 LA PUBLICATION N'EST PAS CÂBLÉE ICI, ET C'EST VOLONTAIRE. Elle se met en
# place avec le plan de version (`docs/release/nodefony-10.md`) : versions
# verrouillées, ordre de publication, jetons. Ce workflow fait la moitié qui a
# du sens tout de suite — prouver que les tarballs s'installent et tiennent
# debout. Publier viendra après, et s'ajoutera ici.
#
# Ce qu'il éprouve, et que rien d'autre dans cette forge ne peut voir : les
# paquets du cœur pointent leurs types vers la SOURCE (`exports["."].types →
# ./index.ts`) pour éviter une course au build, et cette source est ABSENTE du
# tarball. Tant qu'on ne dépaquette pas, tout va bien — et rien ne marche chez
# celui qui installe. Six paquets ont publié des semaines dans cet état.
#
# Le décor est GÉNÉRÉ, jamais copié : le scaffolder est installé DEPUIS son
# tarball, et c'est lui qui produit les applications témoins. Un fichier oublié
# dans `files` ne se voit d'aucune autre façon.
#
# Protocole, pièges et interprétation des échecs : skill `nodefony-release`.

name: Banc de release (mode test)

on:
  # Manuel d'abord : ce banc construit des images docker. On le lance quand on
  # en a besoin — avant une publication, ou après avoir touché à la surface
  # publiée (`exports`, `files`, `peerDependencies`, gabarits `templates/`).
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario à jouer"
        type: choice
        default: all
        options:
          [
            all,
            base,
            front,
            studio,
            edge,
            sql:postgres,
            sql:mariadb,
            sql:mysql,
            cluster,
            global,
            pm:pnpm,
            pm:yarn,
            pm:bun,
          ]
  # Et une passe hebdomadaire : un gate qu'on ne lance que « quand on y pense »
  # est un gate qui pourrit — celui-ci éprouve une surface qui dérive sans
  # qu'aucun test du dépôt ne s'en aperçoive.
  schedule:
    - cron: "0 6 * * 1"

# Relancer le banc ne TUE pas celui qui tourne : la nouvelle exécution attend.
concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Installation vierge — ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    # Les images se construisent : large, mais borné. Un banc qui pend est un
    # banc qu'on annule à la main, donc qu'on cesse de lancer.
    timeout-minutes: 45
    strategy:
      # Chaque scénario dit sa PROPRE vérité — `front` voit ce que `base` ne
      # peut pas voir, et réciproquement. S'arrêter au premier rouge coûterait
      # un second run pour apprendre le reste.
      fail-fast: false
      matrix:
        # Matrice dynamique : un `workflow_dispatch` ciblé ne joue QUE le
        # scénario demandé ; `all` et la passe programmée les jouent TOUS, en
        # parallèle plutôt qu'en série — le pack se refait par job et coûte des
        # secondes, là où `docker build` coûte des minutes.
        #
        # 🔴 `sql` est découpé PAR MOTEUR, et ce n'est pas un détail de forme :
        # les trois en série dépassent le plafond de 45 min ci-dessus, et un
        # banc tué par son plafond ne rend aucun verdict — pas même partiel.
        # Un moteur par job, en parallèle. Ils ne sont pas dans la matrice de
        # PUBLICATION (`release.yml`) : un dialecte cassé se voit sous sept
        # jours, il ne vaut pas 45 min de plus avant chaque `npm publish`.
        #
        # 🔴 `edge` en fait partie, et c'est tout l'objet de #355 : le script
        # savait le jouer depuis #320, aucun déclencheur ne le demandait jamais.
        # Une capacité que rien n'atteint n'existe pas — le jour où un étage du
        # frontal casse, personne ne l'apprend avant qu'un utilisateur déploie.
        #
        # ⚠️ Les parenthèses ne sont pas décoratives. `&&` lie plus fort que
        # `||` (table des opérateurs de la doc GitHub), donc sans elles
        # `A || B && X || Y` s'évalue `A || (B && X) || Y` et rend le BOOLÉEN
        # `true` au lieu de la liste — `fromJSON` échoue alors sur une valeur
        # qui n'a rien à voir avec le sujet.
        #
        # `pm` est découpé PAR GESTIONNAIRE pour la même raison que `sql` :
        # chacun installe, bâtit et construit son image.
        #
        # Sur `schedule`, `github.event.inputs.scenario` est nul ; la
        # comparaison lâche de GitHub coerce nul et chaîne vide vers 0, si bien
        # que les deux passent par la même branche « tous ».
        scenario: >-
          ${{ fromJSON(
            (github.event.inputs.scenario == null || github.event.inputs.scenario == 'all')
              && '["base","front","studio","edge","sql:postgres","sql:mariadb","sql:mysql","cluster","global","pm:pnpm","pm:yarn","pm:bun"]'
              || format('["{0}"]', github.event.inputs.scenario)
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Le scénario `pm` installe l'application AVEC le gestionnaire éprouvé,
      # sur l'hôte : il doit y être. yarn 1 est déjà sur l'exécuteur. Les
      # majeures sont celles que le gabarit suppose (`PACKAGE_MANAGER_TOOL_MAJOR`).
      - name: pnpm (scénario pm:pnpm)
        if: matrix.scenario == 'pm:pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12"

      - name: bun (scénario pm:bun)
        if: matrix.scenario == 'pm:bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"

      # Prérequis EXPLICITE du banc : il empaquette depuis `dist/`. Sans build,
      # il éprouverait un artefact périmé et rendrait un vert sans valeur — le
      # mode de défaillance le plus coûteux de toute cette chaîne.
      - name: Build workspaces (turbo)
        run: npm run build

      # Le graphe symbolique est GÉNÉRÉ, et `src/nodefony/.ai/` est IGNORÉ par
      # git : il existe sur le poste qui vient de commiter — le hook pre-commit
      # le régénère — et JAMAIS sur un checkout frais. `pack-all.mjs` refuse
      # alors de packer le paquet `nodefony`, dont le `files` déclare `.ai`,
      # et le banc de release échoue avant d'avoir installé quoi que ce soit : un
      # rouge dont la cause est un fichier absent, pas un défaut du produit.
      #
      # Constaté au premier run du workflow du code généré, à l'identique sur ses
      # quatre variantes — c'est le piège « un fichier gitignoré ne tient que chez
      # toi », et il ne pouvait se voir que sur une machine qui n'est pas la
      # mienne. Sept secondes.
      - name: Générer le graphe symbolique (absent d'un checkout frais)
        run: npm run generate-symbols

      # Le RAISONNEMENT de la release — validation de version, lecture des
      # messages de commit, ordre de publication, audit des métadonnées,
      # détection de contenu suspect — s'éprouve ICI, avant que quoi que ce soit
      # ne parte. Une release ne se répète pas : la version est brûlée dès le
      # premier `publish`, et npm n'ouvre le retrait que 72 heures. C'est donc la
      # seule occasion d'éprouver ces décisions sans en payer le prix.
      #
      # ⚠️ `vitest` n'est pas déclaré à la racine : il est REMONTÉ depuis un
      # workspace. Si un jour plus aucun workspace ne le porte, cette étape
      # tombera avec un « command not found » — et c'est le bon comportement,
      # bien plus qu'un saut silencieux.
      - name: Cœur de release — la suite qui attaque le script
        shell: bash
        run: npm run test:release

      - name: Smoke test — pack, install vierge, conteneur
        run: npm run release:smoke -- --scenario ${{ matrix.scenario }}

      # Le décor est jetable, son journal ne l'est pas : distinguer un
      # `docker build` en échec d'une app témoin muette décide où chercher.
      - name: État du décor (si échec)
        shell: bash
        if: failure()
        run: |
          echo "::group::images"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -20
          echo "::endgroup::"
          echo "::group::conteneurs"
          docker ps -a --format '{{.Names}} {{.Status}}' | head -20
          echo "::endgroup::"
