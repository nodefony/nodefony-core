name: nodefony-core

on:
  push:
    branches: ["main", "claude-ts"]
  pull_request:
    branches: ["main", "claude-ts"]
  workflow_dispatch:

# Annule les runs précédents sur la même branche / PR si un nouveau push arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Désactive la télémétrie Turbo / Next
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Sortie non interactive
  CI: true
  FORCE_COLOR: 1

jobs:
  # ─── Build + Typecheck — cross-platform, rapide ─────────────────────────────
  build:
    name: Build (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.x", "26.x"]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Show environment
        shell: bash
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces (turbo)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: false

      # Non bloquant TANT QUE la dette héritée n'est pas résorbée : le lint
      # signalait déjà ces erreurs sous eslint, mais rien ne les lisait puisque
      # la CI ne le lançait pas. Le rendre bloquant d'emblée ferait échouer
      # toutes les demandes de fusion dès demain, et on le désactiverait dans la
      # semaine. Retirer `continue-on-error` le jour où le compte atteint zéro —
      # c'est à ce moment seulement qu'il devient un vrai garde-fou.
      - name: Lint (oxlint)
        run: npm run lint
        continue-on-error: true

  # ─── Tests unit — toutes les plateformes, pas besoin du serveur ─────────────
  test-unit:
    name: Tests unit (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.x", "26.x"]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # Bun requis pour `@nodefony/llm/test` (script: "bun test")
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      - name: Run unit tests (turbo)
        run: npm test

  # ─── Tests d'intégration — ubuntu only, démarre le serveur Nodefony ─────────
  test-integration:
    name: Tests intégration (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.x", "26.x"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Le module test contient les routes consommées par les tests d'intégration.
      # Doit être buildé APRÈS le build global (turbo cache) car le mode `development`
      # de Nodefony charge le dist existant au boot.
      - name: Rebuild test module
        run: npm run build --workspace=src/modules/test

      - name: Start Nodefony server (production, no PM2, detached, fail-fast)
        shell: bash
        run: |
          node -e "
          const { spawn } = require('child_process');
          const path = require('path');
          // Le bin 'nodefony' est un artefact de build (src/nodefony/.gitignore: /bin/)
          // généré par 'npm run build'. À l'install (npm ci) il n'existe pas encore →
          // npm ne crée PAS le symlink node_modules/.bin/nodefony → 'npx nodefony'
          // échoue en CI (sh: nodefony: not found). On invoque le bin construit en direct.
          const bin = path.join(process.cwd(), 'node_modules', 'nodefony', 'bin', 'nodefony');
          // production --no-daemon : boot foreground in-process, SANS PM2 (cible
          // cloud-native, 1 process = 1 pod). Logs sur stdout → captés ci-dessous.
          const child = spawn(process.execPath, [bin, 'production', '--no-daemon'], {
            cwd: process.cwd(),
            stdio: ['ignore', 'pipe', 'pipe'],
            detached: true,
          });
          child.stdout.pipe(process.stdout);
          child.stderr.pipe(process.stderr);
          child.unref();
          require('fs').writeFileSync('srv.pid', String(child.pid));
          console.log('SERVER PID=' + child.pid);
          " > nodefony-server.log 2>&1 &

          # Poll avec fail-fast sur erreur fatale, succès sur 4× "Server Listen on"
          for i in $(seq 1 60); do
            if grep -q -E "SyntaxError|CRITIC|EADDRINUSE|ALREADY USE|terminate :" nodefony-server.log 2>/dev/null; then
              echo "::error::Serveur Nodefony a crashé au démarrage"
              grep -E "SyntaxError|CRITIC|terminate|EADDRINUSE" nodefony-server.log | tail -20
              exit 1
            fi
            if [ "$(grep -c 'Server Listen on' nodefony-server.log 2>/dev/null)" -ge 4 ]; then
              echo "✅ Serveur Nodefony READY"
              grep "Server Listen" nodefony-server.log | head -10
              exit 0
            fi
            sleep 1
          done

          echo "::error::Timeout — serveur n'a pas démarré en 60s"
          tail -40 nodefony-server.log
          exit 1

      - name: Health check
        shell: bash
        run: |
          for i in $(seq 1 10); do
            if curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1:5152/nodefony/test/index | grep -q "200"; then
              echo "✅ Health OK"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Health check failed"
          exit 1

      - name: Run integration tests
        run: npm run test:integration

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: |
          echo "─── nodefony-server.log (last 200 lines) ───"
          tail -200 nodefony-server.log || true

      - name: Stop Nodefony server
        if: always()
        shell: bash
        run: |
          if [ -f srv.pid ]; then
            kill -9 $(cat srv.pid) 2>/dev/null || true
          fi
          # Best-effort cleanup des ports
          lsof -ti:5151 -ti:5152 2>/dev/null | xargs -r kill -9 2>/dev/null || true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nodefony-server-log-node${{ matrix.node-version }}
          path: nodefony-server.log
          retention-days: 7
