name: nodefony-core

on:
  push:
    branches: ["main", "claude-ts"]
    paths-ignore: &prose
      # Ce workflow est le SEUL sans filtre, et il est le plus cher : 17 jobs
      # sur trois systèmes. Mesuré — le commit `90497f81`, qui ne touchait que
      # `MIGRATION_STATUS.md` et des retex, a fait tourner les 17, soit ~35 min
      # de runner pour de la prose. Les quatre autres workflows filtrent déjà.
      #
      # 🔴 La liste est CIBLÉE, et surtout PAS `**/*.md` : ce workflow lance
      # `skills:check`, dont la matière EST faite de `SKILL.md`. Le filtre
      # évident aurait éteint ce gate sans que rien ne le signale — un gate
      # qu'on désactive en croyant économiser du runner est le pire des deux.
      - "docs/**"
      - "MIGRATION_STATUS.md"
  pull_request:
    branches: ["main", "claude-ts"]
    paths-ignore: *prose
  workflow_dispatch:

# Annule les runs précédents sur la même branche / PR si un nouveau push arrive.
#
# SAUF sur `main` : là, chaque commit doit garder SON verdict. Annuler y ferait
# disparaître la seule preuve qu'un commit donné passait — et un commit sans
# verdict est indiscernable d'un commit vert quand on remonte le journal pour
# trouver quand une régression est entrée. Ailleurs, seul le dernier état
# compte, et libérer la file est plus utile que d'archiver un résultat périmé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Le jeton du workflow ne peut QUE lire le dépôt. Aucun de ces jobs ne publie,
# ne commente ni n'écrit quoi que ce soit ; sans ce bloc, le jeton hérite des
# permissions par défaut du dépôt, souvent en écriture. Le dépôt est public :
# une dépendance compromise s'exécutant pendant `npm ci` disposerait alors d'un
# jeton capable d'écrire. Recommandation explicite de GitHub.
permissions:
  contents: read

env:
  # Désactive la télémétrie Turbo / Next
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Sortie non interactive
  CI: true
  FORCE_COLOR: 1
  # Turbo lance par défaut jusqu'à DIX tâches de front, sur des runners qui ont
  # QUATRE cœurs — chacune démarrant un binaire natif (rolldown en Rust, tsgo en
  # Go). Sous Windows, ces démarrages simultanés ont fait tomber des jobs entiers
  # avec le code 3221225794 (0xC0000142, STATUS_DLL_INIT_FAILED) : le process ne
  # démarre pas, il n'échoue pas à compiler. Constaté sur trois runs distincts,
  # sur `rolldown` ET sur `tsgo`, et sur Windows seulement.
  #
  # Aligner la concurrence sur les cœurs réels supprime la sur-souscription sans
  # rien coûter : ces tâches sont limitées par le CPU, pas par l'attente.
  #
  # ⚠️ C'est une ATTÉNUATION RAISONNÉE, pas une correction prouvée — elle ne peut
  # pas l'être sans machine Windows. Si 3221225794 revient malgré cette valeur,
  # l'hypothèse « sur-souscription » est fausse : chercher alors du côté de la
  # mémoire du runner ou d'un binaire natif précis, et ne pas baisser davantage.
  # (`TURBO_CONCURRENCY` est bien lu par turbo 2.10 — vérifié : une valeur
  # invalide fait échouer la commande.)
  TURBO_CONCURRENCY: 4

jobs:
  # ─── Vérifications statiques — multi-plateformes ────────────────────────────
  #
  # Ce job ne PRODUIT rien pour les autres : il compile pour vérifier que ça
  # compile, puis contrôle types, style, dépendances et skills. Chaque job de
  # test réinstalle et reconstruit sur son propre runner. Il s'appelait « Build »,
  # ce qui laissait croire à une étape amont dont les tests attendraient la
  # sortie — d'où l'étonnement légitime de voir les tests démarrer « avant lui ».
  # Ils démarrent EN MÊME TEMPS, et c'est le but : plus aucun job n'est mis en
  # attente, donc plus aucun ne peut être masqué par l'échec d'un autre.
  checks:
    name: Vérifications (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.x", "26.x"]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Show environment
        shell: bash
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces (turbo)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: false

      # Bloquant sur les erreurs ET sur les avertissements (`--deny-warnings`).
      #
      # Le compteur est à ZÉRO : chacun des 263 avertissements accumulés a été
      # soit corrigé, soit dérogé avec son motif à l'endroit exact, soit éteint
      # par zone dans `.oxlintrc.json` — jamais laissé traîner. Sans cette
      # option, `oxlint` rend 0 tant qu'il ne reste que des avertissements :
      # la marche resterait verte pendant que le compteur remonte, et on ne le
      # découvrirait qu'en le regardant à la main. C'est exactement ce qui
      # s'était produit quand la CI ne lançait pas le lint du tout.
      #
      # Conséquence assumée : un avertissement neuf CASSE la demande de fusion.
      # C'est le but — une règle qu'on décide d'ignorer se désactive dans
      # `.oxlintrc.json`, où la décision se lit et se discute.
      #
      # L'option vit dans le script `lint` du manifeste racine, pas ici : quand
      # elle n'était posée QUE dans cette marche, le lint local rendait 0 sur un
      # avertissement que la forge refusait — la panne n'apparaissait qu'après
      # le `push`, sur une machine où personne ne débogue. Une seule écriture.
      - name: Lint (oxlint)
        run: npm run lint

      # Bloquant à partir de « high ». `npm ci` tourne avec `--no-audit` (l'audit
      # à l'installation ralentit sans rien bloquer) — la vérification est donc
      # faite ICI, à un endroit qui peut casser la marche. Une faille de gravité
      # haute se ferme par un `overrides` dans le package.json racine, où la
      # décision se lit, plutôt qu'en laissant l'alerte vivre au tableau de bord.
      - name: Audit des dépendances
        run: npm audit --audit-level=high

      # Conformité des skills au standard Agent Skills : fiches publiques à jour,
      # aucun renvoi mort, aucun fichier orphelin. Le contrôle existait en local
      # depuis des semaines sans que rien ne le déclenche — c'est précisément le
      # motif qui a laissé le lint dériver jusqu'à 263 avertissements. Un seul
      # système d'exploitation suffit : il ne lit que des fichiers.
      - name: Conformité des skills
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '26.x'
        run: npm run skills:check

      # Les JUGES du banc devkit, éprouvés — pas le banc lui-même.
      #
      # Le banc lance de vrais agents et coûte de l'argent : il n'a rien à faire
      # dans une passe automatique. Ses auto-contrôles, eux, ne lancent aucun
      # agent, ne montent aucun décor, et tournent en quelques secondes pour zéro
      # jeton — or c'est EUX qui décident si un verdict de banc veut dire quelque
      # chose. Ils vivaient en local sans que rien ne les déclenche : exactement
      # le motif qui a laissé le lint dériver jusqu'à 263 avertissements.
      #
      # `--prove` ampute chaque sonde et exige qu'un cas tombe : une sonde qui
      # reste verte amputée n'est pas exercée par ses échantillons. Sortie `2` =
      # couverture incomplète (sonde ajoutée sans son échantillon) — bloquante
      # ici, parce qu'un vert incomplet lu comme un vert complet est le piège
      # maison numéro un.
      #
      # NON couvert par cette étape : `bench-schema.selftest.mjs`, qui exige une
      # base PostgreSQL pour exercer son lecteur et sort `2` sans elle. Il est
      # lancé dans `orm.yml`, là où le service existe déjà.
      - name: Auto-contrôle des juges du banc devkit
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '26.x'
        run: |
          node .claude/skills/nodefony-devkit-bench/scripts/bench-discoverability.selftest.mjs
          node .claude/skills/nodefony-devkit-bench/scripts/bench-discoverability.selftest.mjs --prove
          node .claude/skills/nodefony-devkit-bench/scripts/lib/gate-route-param.selftest.mjs
          node .claude/skills/nodefony-devkit-bench/scripts/lib/gate-session-csrf.selftest.mjs

  # ─── Tests unit — toutes les plateformes, pas besoin du serveur ─────────────
  #
  # ⚠️ PAS de `needs: build`, et c'est délibéré. Un job qui dépend d'un job À
  # MATRICE attend les SIX variantes et échoue si UNE SEULE tombe : les tests
  # passaient alors en `skipped`, ce qui s'affiche comme « non exécuté » et se
  # lit comme « rien à signaler ». Vécu ici pendant deux mois — une variante de
  # build rouge masquait l'état réel de tout ce qui suit. Ce job réinstalle et
  # reconstruit de toute façon : le rendre indépendant ne coûte rien et lui fait
  # dire SA propre vérité, en parallèle des autres.
  test-unit:
    name: Tests unit (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.x", "26.x"]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # `NF_GATES_ALLOW` — ce que cette passe n'exerce PAS, écrit noir sur blanc.
      #
      # Depuis que le rapporteur des gates fait échouer une passe dont une cible
      # déclarée n'a pas tourné, ce job doit dire ce qu'il ne couvre pas : il
      # tourne sur TROIS systèmes d'exploitation, on n'y montera pas trois bases
      # de données. Ces cibles sont exercées par `orm.yml`, sur Linux, avec le
      # décor complet — elles ne sont donc pas perdues, elles sont AILLEURS.
      #
      # Ce n'est pas un interrupteur pour faire taire un rouge : chaque nom
      # ajouté ici est une couverture qu'on renonce à obtenir ICI, et le rapport
      # de fin de suite les nomme même quand tout le reste est vert. En retirer
      # un doit rester possible ; en ajouter un se justifie.
      - name: Run unit tests (turbo)
        env:
          # `RUN_CLUSTER_E2E` figure ici pour une raison différente des autres :
          # ce n'est pas un serveur qui manque, c'est un COÛT qu'on refuse — des
          # process forkés, six fois (trois systèmes × deux versions de Node).
          # Les deux topologies sont éprouvées par `orm.yml`, une fois, sur Linux.
          NF_GATES_ALLOW: NF_PG_URL,NF_MYSQL_URL,REDIS_URL,REDIS_TEST_URL,MONGO_TEST_URI,NF_LOKI_TEST_URL,NF_OPENSEARCH_TEST_URL,RUN_CLUSTER_E2E
        run: npm test

  # ─── Filet CLI — exerce le BINAIRE `nodefony`, sur les deux plateformes ─────
  #
  # Pourquoi ce job existe : le lanceur (`src/bin/nodefony.ts`) est la porte
  # d'entrée du framework, et il est écrit POUR Windows — `fileURLToPath` à
  # l'entrée, `pathToFileURL(...).href` avant l'`import()` dynamique (sans quoi
  # Node refuse un chemin `C:\…` comme URL de module). Cet effort n'était prouvé
  # nulle part : `test:boot` ne tournait dans AUCUN job. Le support de Windows
  # est un impératif du framework, pas une compatibilité de bonne volonté — il
  # se vérifie donc là où il peut casser, à chaque envoi.
  #
  # Ces cas démarrent de VRAIS serveurs (`production`, `cluster`, `--detach`) et
  # attendent leur arrêt propre : c'est précisément le code le plus dépendant du
  # système (signaux, groupes de processus, libération des ports).
  test-cli:
    name: Filet CLI (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["26.x"]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      - name: Filet CLI (RUN_CLI_BOOT)
        run: npm run test:boot

  # ─── Tests d'intégration — ubuntu only, démarre le serveur Nodefony ─────────
  # Indépendant lui aussi (même raison que `test-unit` ci-dessus) : c'est le job
  # le plus lent à révéler ses pannes, donc le dernier qu'on veuille voir
  # `skipped` derrière l'échec d'une plateforme qui ne le concerne pas.
  #
  # Le MODE est une dimension de la MATRICE, pas une propriété de la branche.
  # Il l'a été — `main` en production, tout le reste en développement — et le
  # défaut se lit dans l'ordre des découvertes : la casse propre au mode livré
  # (comptes seedés autrement, modules gatés, observabilité éteinte) n'apparaît
  # qu'APRÈS la fusion, sur la branche où plus personne ne peut la corriger sans
  # un second aller-retour. C'est le même défaut que « filtrer par branche »
  # corrigé la veille pour l'infra, resté ici.
  #
  # Trois variantes, pas quatre : le mode éprouve le GATING du framework, pas le
  # moteur JavaScript — les deux versions de Node sont déjà croisées en
  # développement, et une quatrième tâche ne dirait rien de neuf.
  test-integration:
    name: Tests intégration (Node ${{ matrix.node-version }} / ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "24.x"
            mode: development
          - node-version: "26.x"
            mode: development
          - node-version: "26.x"
            mode: production
    timeout-minutes: 20
    env:
      # Dérogation au gating `policy: "dev"` — SANS EFFET hors production, donc posée
      # inconditionnellement. Elle ne sert qu'à la marche `main`, qui démarre en
      # production : sans elle, le module qui porte les routes du banc n'est pas chargé
      # et la suite entière répondrait 404. Le runtime en dérogation s'arrête tout seul
      # au bout de 30 minutes — largement au-delà du plafond de 20 minutes de cette
      # tâche, et c'est la garde qui empêche cette variable de survivre à un vrai
      # déploiement si elle était un jour recopiée ailleurs.
      NF_WITH_DEV_MODULES: "1"
      # Backoff de connexion désactivé sur le serveur de banc — et sur les tests,
      # qui lisent la même variable pour savoir s'ils peuvent éprouver le câblage
      # du 429. Le throttle compte par identifiant SAISI et vit aussi longtemps que
      # le serveur : trois échecs n'importe où dans la suite (un banc d'attaque en
      # produit par conception) condamnent tous les fichiers suivants, `admin`
      # répondant alors 429 même avec le bon mot de passe. Le backoff reste prouvé
      # unitairement ; son câblage se rejoue avec la variable à `true`.
      NF__SECURITY__RATELIMIT__ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Le module test contient les routes consommées par les tests d'intégration.
      # Doit être buildé APRÈS le build global (turbo cache) car le mode `development`
      # de Nodefony charge le dist existant au boot.
      - name: Rebuild test module
        run: npm run build --workspace=src/modules/test

      # Le serveur démarre en PRODUCTION, où les clés de chiffrement ne sont plus
      # optionnelles : sans elles, le 2FA et les webhooks se désactivent en
      # journalisant deux CRITIC — et la sonde de démarrage ci-dessous, qui
      # cherche précisément « CRITIC », déclarait le serveur mort alors qu'il
      # écoutait ses quatre ports. Le journal était juste, le verdict faux.
      #
      # Générées ici, jamais commitées (`.env.local` tombe sous `*.local` du
      # .gitignore) : 32 octets en base64, exactement ce que produit
      # `nodefony security:secrets` — une seule définition du format.
      # `NF_ADMIN_PASSWORD` en prime : sans lui aucun compte n'est seedé, et le
      # firewall des bancs d'intégration n'aurait personne à authentifier.
      - name: Générer les clés de production (.env.local)
        shell: bash
        run: |
          node -e "
          const { randomBytes } = require('node:crypto');
          const gen = () => randomBytes(32).toString('base64');
          const lines = [
            '# clés éphémères de CI — régénérées à chaque exécution, jamais commitées',
            'NF_TOTP_KEY=' + gen(),
            'NF_WEBHOOK_KEY=' + gen(),
            'NF_CSRF_SECRET=' + gen(),
            // Mot de passe du compte seedé : FIXE, et il doit valoir ce que les
            // bancs présentent. Un tirage aléatoire donnait un compte que rien ne
            // sait ouvrir — la suite entière recevait 401, symptôme jumeau des 429
            // d'hier : le serveur répondait correctement à des tests qui parlaient
            // d'un autre monde. Sans risque : ce runtime est éphémère, il vit le
            // temps d'une tâche et n'est joignable que depuis elle.
            'NF_ADMIN_PASSWORD=secret',
            '',
          ];
          require('node:fs').writeFileSync('.env.local', lines.join('\n'));
          console.log('✅ .env.local généré (4 clés, valeurs non affichées)');
          "

      # Le SECOND compte du banc, en production seulement — et créé ICI, pas seedé.
      #
      # `provisionUsers` seede `admin` SEUL en production : les comptes de fixture
      # ont un hash public (le dépôt est ouvert), ils n'ont donc rien à faire dans
      # le mode qu'on livre. C'est le comportement SAIN, à ne surtout pas amender
      # pour faire passer une tâche. Or neuf fichiers d'intégration éprouvent
      # précisément ce qu'un compte NON-administrateur a le droit de faire (403 du
      # RBAC, cloisonnement des sessions, anti-IDOR) : sans second compte, ils ne
      # peuvent pas s'écrire. Les rendre muets en production (`skipIf`) rejouerait
      # le silence qu'on vient de supprimer partout ailleurs.
      #
      # Le banc se donne donc ce compte lui-même, par la porte publique du
      # framework — la commande qu'un exploitant utiliserait. Avant le démarrage
      # du serveur : la commande boot son propre kernel (qui crée les tables et
      # seede `admin`), donc aucune écriture concurrente sur la base.
      - name: Créer le second compte du banc (production)
        if: matrix.mode == 'production'
        env:
          NODE_ENV: production
        run: node node_modules/nodefony/bin/nodefony security:user:add user --password secret --roles ROLE_USER

      # `--no-watch` : mode développement SANS superviseur ni rechargement. Un rebuild
      # déclenché au milieu du run couperait les connexions sous les tests, et le rouge
      # accuserait le code alors que le fautif serait le décor.
      #
      # En production, le module qui porte les routes du banc est `policy: "dev"` —
      # il n'est chargé que par la dérogation `NF_WITH_DEV_MODULES` posée plus haut,
      # sans quoi la suite entière répondrait 404.
      - name: Start Nodefony server (detached, fail-fast)
        uses: ./.github/actions/nodefony-server
        with:
          mode: ${{ matrix.mode == 'production' && 'production' || 'development --no-watch' }}

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Nodefony server
        if: always()
        uses: ./.github/actions/nodefony-server
        with:
          action: stop

      # ─── Seconde passe : le CÂBLAGE du 429 ────────────────────────────────────
      #
      # Le décor principal éteint le backoff, sans quoi trois échecs produits par un
      # banc d'attaque condamnent `admin` pour tous les fichiers suivants. Éteindre
      # rendait du même coup MUETS les deux cas qui prouvent que le throttle est
      # branché sur les deux portes — un skip compte comme vert, la garantie
      # anti-bruteforce n'était donc plus prouvée nulle part.
      #
      # Ces deux cas martèlent un identifiant UNIQUE par exécution : ils ne touchent
      # pas au compte partagé, et peuvent donc tourner seuls sur un serveur armé.
      - name: Start Nodefony server (backoff ARMÉ)
        uses: ./.github/actions/nodefony-server
        with:
          mode: ${{ matrix.mode == 'production' && 'production' || 'development --no-watch' }}
          log-file: nodefony-server-throttle.log
          pid-file: srv-throttle.pid
          env: NF__SECURITY__RATELIMIT__ENABLED=true

      # Sélection par NOM : jouer les fichiers entiers réarmerait le problème que
      # le décor principal contourne (les autres cas de `firewall-auth` échouent
      # sur `admin` par conception).
      # Le filet est DANS la suite (`NF_GATES_EXPECT`), plus dans un `jq` ici.
      #
      # Sans lui cette étape serait décorative : un motif de sélection qui ne
      # mord plus — un cas renommé, déplacé — laisse vitest sortir 0 avec 591
      # tests `pending`. Vérifié à l'époque : exit=0, zéro cas passé, étape
      # verte. On exige donc que CHAQUE porte ait produit un cas passé, nommée
      # par le motif qui la désigne. Le rapporteur échoue et dit lequel manque.
      - name: Câblage du backoff NIST (les 2 cas opt-in)
        working-directory: src/packages/@nodefony/http
        env:
          NF__SECURITY__RATELIMIT__ENABLED: "true"
          NF_GATES_EXPECT: "backoff NIST,NIST PARTAGÉ"
        run: |
          npx vitest run --config vitest.integration.config.ts \
            -t "(backoff NIST|NIST PARTAGÉ)"

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: |
          for f in nodefony-server.log nodefony-server-throttle.log; do
            [ -f "$f" ] || continue
            echo "─── $f (last 200 lines) ───"
            tail -200 "$f" || true
          done

      - name: Stop Nodefony server (backoff ARMÉ)
        if: always()
        uses: ./.github/actions/nodefony-server
        with:
          action: stop
          pid-file: srv-throttle.pid

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nodefony-server-log-node${{ matrix.node-version }}-${{ matrix.mode }}
          # Les deux décors, sinon un échec de la seconde passe s'analyse à l'aveugle.
          path: |
            nodefony-server.log
            nodefony-server-throttle.log
            src/packages/@nodefony/http/throttle-report.json
          retention-days: 7
          if-no-files-found: ignore
