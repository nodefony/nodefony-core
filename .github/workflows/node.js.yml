name: nodefony-core

on:
  push:
    branches: ["main", "claude-ts"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      # Install Bun
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Start framework
        run: node node_modules/nodefony/bin/nodefony development &
        shell: bash

      - run: sleep 10
        shell: bash

      - run: npm test

      - name: Stop framework
        if: always()
        run: kill $(pgrep -f "nodefony development" || echo 0) 2>/dev/null || true
        shell: bash
