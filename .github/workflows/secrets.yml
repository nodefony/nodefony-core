# ─────────────────────────────────────────────────────────────────────────────
# SECRETS — ce dépôt est PUBLIC, et un secret commité est un secret PUBLIÉ.
#
# La rotation est le seul remède réel : le retirer d'un commit ne le retire de
# nulle part, il reste dans les clones, les caches et les miroirs. Ce gate ne
# répare donc rien — il EMPÊCHE, et c'est sa seule valeur.
#
# Pourquoi un scanner et pas une relecture : la QUESTION ZÉRO du dépôt. Un
# automate est gratuit, exhaustif et reproductible ; un modèle survole, n'offre
# aucune garantie de couverture, et sur une tâche à seuil (l'entropie d'une
# chaîne) il est à la fois plus cher ET moins fiable. `gitleaks` lit les 2 700
# fichiers en secondes ; ce qu'un humain fait, c'est TRIER ce qu'il rend.
#
# La liste d'exceptions vit dans `.gitleaks.toml`, à la racine, et elle est
# NOMINATIVE : jamais un dossier exclu pour se débarrasser d'une alerte — un
# dossier exclu avale les vrais secrets qu'on y déposera demain.
# ─────────────────────────────────────────────────────────────────────────────
name: Secrets

on:
  push:
    branches: [main, claude-ts]
  pull_request:
  # Un secret peut entrer par un chemin que le gate ne voyait pas encore : la
  # passe hebdomadaire rejoue le scan avec les règles du JOUR, pas celles du
  # commit qui l'a introduit.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: Aucun secret dans l'arbre
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # L'historique ENTIER : un secret retiré du dernier commit vit encore
          # dans celui qui l'a introduit, et c'est là qu'un tiers le lit.
          fetch-depth: 0

      - name: Installer gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # 🔴 LE GATE SE PROUVE AVANT DE JUGER. Un scanner mal configuré — un
      # chemin exclu de trop, une règle qui ne charge pas — rend « 0 secret »
      # avec le même aplomb qu'un dépôt propre, et personne ne peut distinguer
      # les deux. On lui donne donc d'abord un secret ÉVIDENT, et il doit le
      # trouver. S'il ne le trouve pas, l'étape échoue ici, et le verdict qui
      # suit n'est jamais rendu.
      - name: Le scanner MORD (témoin fautif)
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ PAS sous `tmp/` : la liste d'exceptions écarte ce dossier, et le
          # témoin y serait invisible — le contrôle échouerait en accusant la
          # configuration alors qu'elle marche. Mesuré en écrivant cette étape.
          mkdir -p .temoin-gitleaks
          # DEUX témoins de familles différentes, et le choix n'est pas anodin :
          # `AKIAIOSFODNN7EXAMPLE` — la clé qu'on écrit d'instinct — n'est PAS
          # détectée, gitleaks la connaît comme la clé d'EXEMPLE d'AWS et
          # l'ignore. Un témoin non détecté aurait fait échouer cette étape
          # pour rien ; pire, l'inverse (un témoin qu'on croit détecté et qui
          # ne l'est pas) rend un gate qui se croit prouvé. Vérifié à la main :
          # jeton GitHub → trouvé, clé privée PEM → trouvée.
          # 🔴 Les témoins sont COMPOSÉS à l'exécution, jamais écrits en clair.
          # Vécu au premier run : écrits littéralement, ils étaient trouvés dans
          # CE fichier par le scan de l'arbre — le gate mordait sur son propre
          # témoin et rendait le job rouge à tort. La bonne nouvelle est qu'il
          # mordait vraiment ; la mauvaise, qu'un fichier de la forge portait
          # deux secrets d'apparence. Les exclure eût été pire : ce fichier doit
          # rester surveillé comme les autres.
          PREFIXE=gh; SUITE=p_016C7869B8F3B4A2C1D5E9F0A1B2C3D4E5F6
          printf 'const t = "%s%s";\n' "$PREFIXE" "$SUITE" \
            > .temoin-gitleaks/temoin.ts
          DEBUT='-----BEGIN RSA PRIVATE'; FIN='KEY-----'
          printf -- '%s %s\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF0qs4d5d2P4pMxvHqBFXwEKAiPBv\n-----END RSA PRIVATE %s\n' \
            "$DEBUT" "$FIN" "$FIN" > .temoin-gitleaks/temoin.pem
          for temoin in temoin.ts temoin.pem; do
            if gitleaks dir ".temoin-gitleaks/$temoin" --config .gitleaks.toml --no-banner --exit-code 1; then
              echo "::error::le scanner n'a PAS vu $temoin — sa configuration ne charge pas, et son « 0 secret » ne vaut rien"
              rm -rf .temoin-gitleaks
              exit 1
            fi
          done
          echo "✓ le scanner mord sur deux témoins plantés"
          rm -rf .temoin-gitleaks

      - name: Aucun secret dans l'arbre de travail
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks-arbre.json

      - name: Aucun secret dans l'HISTORIQUE
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks-historique.json

      - name: Le rapport (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks
          path: |
            gitleaks-arbre.json
            gitleaks-historique.json
          retention-days: 7
          if-no-files-found: ignore
