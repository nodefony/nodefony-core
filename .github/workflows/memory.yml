name: Charge et mémoire (pipeline)

# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI CE WORKFLOW EXISTE
#
# Le `CLAUDE.md` du dépôt fait du gate mémoire une RÈGLE ABSOLUE : le lancer avant
# tout commit touchant `@nodefony/http`, `@nodefony/framework` ou le pipeline de
# requête, et considérer un seuil franchi comme un blocage. Cette règle n'était
# appliquée par rien : elle reposait entièrement sur la mémoire de l'auteur, et un
# oubli ne laissait aucune trace. Une fuite se paie en production, pas en revue.
#
# POURQUOI UN GATE MÉMOIRE EN CI, ALORS QUE LES BANCS DE PERF RESTENT DEHORS
#
# Ce n'est pas la même mesure. Une latence dépend du voisin bruyant qui partage le
# runner — d'où des seuils non reproductibles, et un rouge qui n'apprend rien. Une
# FUITE, elle, fuit quelle que soit la charge : 35 Mo de heap retenus sur 1000
# requêtes ne deviennent pas 5 Mo parce que la machine est occupée.
#
# Trois propriétés rendent ce banc-ci supportable sur un runner partagé, là où un
# gate mémoire est d'ordinaire réputé instable :
#   · les seuils sont GROSSIERS (35 Mo / 1000 requêtes, 10 Mo / 100 crashes) —
#     le bruit du ramasse-miettes se compte en quelques Mo, une vraie fuite en
#     dizaines ; la marge entre les deux est large ;
#   · `vitest.load.config.ts` impose `fileParallelism: false` + `singleFork`,
#     ce qui supprime par construction la contention entre fichiers ;
#   · le serveur reçoit `--expose-gc`, sans quoi la sonde du module de test ne
#     force RIEN et l'on compare des tas pleins de déchets en attente — la
#     mesure devient alors du bruit déguisé en fuite.
#
# Ce qui tourne ici n'est pas que la mémoire : `test:load` porte AUSSI la charge
# WebSocket, les scopes d'injection, les sessions et les flux. Sept fichiers, dont
# un seul mesure le heap.
#
# Si malgré cela il devenait instable, la conduite à tenir est de le déplacer vers
# une exécution nocturne — pas de le rendre non bloquant. Un contrôle qui ne peut
# pas échouer n'est pas un contrôle, c'est une décoration.
#
# POURQUOI FILTRÉ PAR CHEMIN
#
# Il ne s'éveille que sur les paquets que la règle vise. Une modification de
# documentation ou de frontal n'a aucune raison de démarrer un serveur et de
# marteler mille requêtes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/http/**"
      - "src/packages/@nodefony/framework/**"
      - "src/nodefony/**"
      - "src/modules/test/**"
      - ".github/workflows/memory.yml"
      - ".github/actions/nodefony-server/**"
  pull_request:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/http/**"
      - "src/packages/@nodefony/framework/**"
      - "src/nodefony/**"
      - "src/modules/test/**"
      - ".github/workflows/memory.yml"
      - ".github/actions/nodefony-server/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true
  FORCE_COLOR: 1

jobs:
  memory:
    name: Charge, fuites et scopes — HTTP et WebSocket
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Le module test porte les routes que martèle le banc ; il se construit après
      # le build global, le mode développement chargeant le `dist` présent au boot.
      - name: Rebuild test module
        run: npm run build --workspace=src/modules/test

      # TOUJOURS en développement, même sur `main` : ce banc mesure le pipeline de
      # requête, pas le gating de production. Les routes qu'il sollicite vivent dans
      # un module `policy: "dev"` — en production elles répondraient 404, et l'on
      # mesurerait la mémoire d'un serveur qui ne fait rien.
      # `--expose-gc` n'est PAS un réglage de confort : la sonde `/nodefony/test/memory`
      # force un ramasse-miettes avant de relever le heap, et ce forçage est un NO-OP
      # silencieux quand le drapeau manque. Sans lui, le banc compare des tas qui
      # contiennent le déchet en attente de collecte — le module de test le documente
      # lui-même : 5000 trames WebSocket laissent alors ~180 Mo qui passent pour une
      # fuite. Le premier run de ce gate a d'ailleurs accusé le chemin de crash
      # synchrone, alors que le crash `TypeError` — synchrone lui aussi — passait :
      # ce n'était pas une rétention, c'était la mesure qui était aveugle.
      - name: Start Nodefony server
        uses: ./.github/actions/nodefony-server
        with:
          mode: development --no-watch
          node-args: --expose-gc

      # ⚠️ AUCUN `--reporter` ici, et c'est la leçon de ce fichier : cette option
      # REMPLACE `test.reporters` de la configuration au lieu de s'y ajouter.
      # L'étape la posait pour obtenir le rapport JSON — et désarmait du même
      # geste le rapporteur de gates censé la protéger. Un job vert, aucune garde
      # chargée : exactement le silence que ce workflow existe pour rompre.
      # Le rapport JSON est désormais déclaré dans `vitest.load.config.ts`, sous
      # condition de `CI`, où il COHABITE avec les autres rapporteurs.
      #
      # `test:load` et NON `test:memory` : la même configuration séquentielle porte
      # les deux, et le banc mémoire n'en est qu'un fichier sur sept. Les six autres
      # — connexions WebSocket concurrentes et churn, débit d'écho et de diffusion,
      # latence, flux, sessions, et surtout les fuites de scopes d'injection sous
      # charge — sont décrits comme stables en intégration continue par le kit de
      # charge, et ne tournaient nulle part. Les sondes de RUPTURE, elles, restent
      # fermées : elles épuisent les ports éphémères de la machine hôte, ce qui n'a
      # rien à faire sur un runner partagé.
      #
      # `NF_GATES_EXPECT` nomme les DEUX moitiés du gate mémoire. Compter « au
      # moins une mesure passée » ne suffisait pas : la moitié WebSocket peut
      # disparaître pendant que la moitié HTTP porte le vert à elle seule.
      - name: Charge et mémoire — WebSocket, scopes, sessions, flux, heap
        working-directory: src/packages/@nodefony/http
        env:
          NF_GATES_EXPECT: "Memory leaks — HTTP,Memory leaks — WebSocket"
        run: npm run test:load

      # `always()` : c'est en ÉCHEC que ce résumé sert le plus. Il dit de combien
      # le seuil a été franchi — un dépassement de quelques Mo se lit comme du
      # bruit de ramasse-miettes, un dépassement d'un ordre de grandeur comme une
      # fuite. Sans ce chiffre, les deux se ressemblent.
      # Les sondes de rupture (`RUN_WS_RUPTURE`) restent volontairement fermées : elles
      # épuisent les ports éphémères de l'hôte. Leur silence est un choix, pas un oubli.
      - name: Ce que le banc a mesuré
        if: always()
        working-directory: src/packages/@nodefony/http
        run: |
          [ -f memory-report.json ] || { echo "::error::aucun rapport — le banc n'a pas démarré."; exit 1; }
          passed=$(jq '.numPassedTests' memory-report.json)
          failed=$(jq '.numFailedTests' memory-report.json)
          echo "mesures passées : $passed · échouées : $failed"
          jq -r '.testResults[].assertionResults[]
            | select(.status == "failed")
            | "  ✗ \(.fullName)\n    \(.failureMessages[0] // "" | split("\n")[0])"' memory-report.json
          # Garde de DERNIER RECOURS, et non un doublon de `NF_GATES_EXPECT` :
          # celui-ci vit dans le rapporteur de fin de suite, donc il ne dit rien
          # si le run s'interrompt avant d'y arriver. Les deux ne répondent pas à
          # la même question — « quels bancs devaient tourner » là-haut, « la
          # passe est-elle seulement allée au bout » ici.
          if [ "$passed" -eq 0 ]; then
            echo "::error::Aucune mesure n'a tourné — le gate mémoire est décoratif."
            exit 1
          fi

      - name: Rapport de mesure (échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-report
          path: |
            src/packages/@nodefony/http/memory-report.json
            nodefony-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: tail -200 nodefony-server.log || true

      - name: Stop Nodefony server
        if: always()
        uses: ./.github/actions/nodefony-server
        with:
          action: stop
