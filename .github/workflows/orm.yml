name: Bancs sur infrastructure réelle

# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI CE WORKFLOW EXISTE
#
# `npm test` sur @nodefony/drizzle laisse 442 tests sur 781 NON EXÉCUTÉS — soit
# les deux dialectes de PRODUCTION, PostgreSQL et MySQL — et sort vert quand
# même : un test sauté ne bloque pas. Le vert par défaut ne prouvait donc que
# sqlite, sans jamais le dire. Même silence côté Redis (15 cas muets faute d'URL).
#
# Ces suites savent parler à un vrai serveur ; il ne leur manquait qu'un serveur.
# Les variables attendues et leur forme sont définies une seule fois, dans
# `vitest.gates.ts` à la racine — ce fichier les POSE, il ne les invente pas.
#
# Le second job traite le même mal sur ce que le framework promet de plus
# structurant : une socket distribuée en cluster. Les deux bancs qui l'éprouvent
# — fan-out cross-process par IPC, fan-out cross-pod par le backplane Redis —
# s'auto-skippaient faute d'un interrupteur que personne ne posait. La garantie
# la plus centrale du produit reposait donc sur des tests jamais exécutés.
#
# POURQUOI UN WORKFLOW SÉPARÉ, ET FILTRÉ PAR CHEMIN
#
#  · `paths:` — démarrer trois bases pour un changement de feuille de style est
#    une dépense sans contrepartie. Ce workflow ne s'éveille que si un paquet qui
#    parle à un store a bougé. C'est ce filtre, et non une restriction de branche,
#    qui garde la boucle de développement courte : réserver ces bancs à `main`
#    reviendrait à découvrir la casse après le merge, quand elle coûte le plus.
#  · séparé — il tourne EN PARALLÈLE du workflow principal, qu'il n'allonge pas,
#    et un décor d'infra défaillant n'y teint pas en rouge des jobs qui n'ont
#    rien à voir.
#  · Ubuntu seulement — contrainte de la plateforme, pas un choix : les service
#    containers exigent un runner Linux. Ce qui est éprouvé ici est du SQL et un
#    protocole, pas un comportement de système de fichiers.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/drizzle/**"
      - "src/packages/@nodefony/redis/**"
      - "src/packages/@nodefony/orm-core/**"
      - "src/packages/@nodefony/mongoose/**"
      - "src/packages/@nodefony/realtime/**"
      # `clusterIpc.e2e.test.ts` importe `ClusterRelay` du CŒUR : c'est lui qui
      # route le fan-out entre workers. Sans ce chemin, le modifier ne rejouait
      # aucun des cinq cas de fan-out IPC — dont le seul qui éprouve N > 2
      # workers, que le banc autonome ne couvre pas.
      - "src/nodefony/src/service/cluster/**"
      - "src/nodefony/src/tests/support/**"
      # Les actions locales qui LÈVENT le décor de ces bancs. Les casser doit
      # rejouer ce qui s'en sert : sans ces chemins, un décor dégradé n'était
      # constaté qu'au prochain commit touchant un paquet — sur une cause
      # devenue introuvable.
      - ".github/actions/redis/**"
      - ".github/actions/mongo/**"
      # Les bancs de pod que ce workflow LANCE — sans eux dans les chemins,
      # le banc pouvait casser sans que rien ne se déclenche pour le dire.
      - ".claude/skills/nodefony-multipod-bench/scripts/**"
      # Les routes de sonde que le banc de persistance appelle.
      - "src/modules/test/nodefony/controller/DbController.ts"
      - "vitest.gates.ts"
      - ".github/workflows/orm.yml"
  pull_request:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/drizzle/**"
      - "src/packages/@nodefony/redis/**"
      - "src/packages/@nodefony/orm-core/**"
      - "src/packages/@nodefony/mongoose/**"
      - "src/packages/@nodefony/realtime/**"
      # `clusterIpc.e2e.test.ts` importe `ClusterRelay` du CŒUR : c'est lui qui
      # route le fan-out entre workers. Sans ce chemin, le modifier ne rejouait
      # aucun des cinq cas de fan-out IPC — dont le seul qui éprouve N > 2
      # workers, que le banc autonome ne couvre pas.
      - "src/nodefony/src/service/cluster/**"
      - "src/nodefony/src/tests/support/**"
      # Les actions locales qui LÈVENT le décor de ces bancs. Les casser doit
      # rejouer ce qui s'en sert : sans ces chemins, un décor dégradé n'était
      # constaté qu'au prochain commit touchant un paquet — sur une cause
      # devenue introuvable.
      - ".github/actions/redis/**"
      - ".github/actions/mongo/**"
      # Les bancs de pod que ce workflow LANCE — sans eux dans les chemins,
      # le banc pouvait casser sans que rien ne se déclenche pour le dire.
      - ".claude/skills/nodefony-multipod-bench/scripts/**"
      # Les routes de sonde que le banc de persistance appelle.
      - "src/modules/test/nodefony/controller/DbController.ts"
      - "vitest.gates.ts"
      - ".github/workflows/orm.yml"
  # Rattrapage manuel : un changement transverse peut casser ces suites sans
  # toucher aucun des chemins ci-dessus.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true
  FORCE_COLOR: 1

jobs:
  stores:
    name: Stores sur infra réelle + gate du juge de schéma (PostgreSQL · MariaDB · Redis · MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Images, identifiants et sondes de santé ALIGNÉS sur `docker/docker-compose.yml`.
    # Deux décors pour une même cible ne peuvent pas être fusionnés — compose n'est
    # pas lisible par `services:` — donc la seule protection contre la dérive est
    # qu'ils échouent ensemble : une suite qui passe ici et pas en local (ou
    # l'inverse) est le signal que ces deux listes ont divergé.
    #
    # Les sondes ne sont pas décoratives : GitHub attend qu'un service soit SAIN
    # avant de lancer la moindre étape. Sans elles, la suite démarrerait avant la
    # base et rendrait un rouge qui parle de connexion refusée au lieu du code —
    # le faux négatif classique de ce genre de décor.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodefony
          POSTGRES_PASSWORD: nodefony-dev
          POSTGRES_DB: nodefony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodefony -d nodefony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nodefony-dev
          MARIADB_USER: nodefony
          MARIADB_PASSWORD: nodefony-dev
          MARIADB_DATABASE: nodefony
        ports:
          - 3306:3306
        # `healthcheck.sh` est l'outil officiel de l'image mariadb ; `--innodb_initialized`
        # attend l'initialisation du moteur, pas seulement l'ouverture du port.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Redis n'est PAS ici : il lui faut `redis-server --requirepass …`, et
      # `services:` ne sait pas passer d'arguments au conteneur — `options` est
      # inséré dans `docker create` AVANT l'image, donc `--requirepass` y est lu
      # comme une option docker et la création échoue (exit 125, constaté).
      # Le mot de passe n'est pas négociable : les bancs se connectent avec, et un
      # serveur sans authentification les ferait échouer sur « AUTH sans mot de
      # passe configuré ». Il est donc démarré en étape, plus bas.

    env:
      # Forme des URL : `vitest.gates.ts` (source unique). Le job tourne sur le
      # runner, pas dans un conteneur → les services sont joints par 127.0.0.1
      # sur les ports publiés ci-dessus.
      NF_PG_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony
      NF_MYSQL_URL: mysql://nodefony:nodefony-dev@127.0.0.1:3306/nodefony
      NF_REDIS_URL: redis://:nodefony-dev@127.0.0.1:6379
      # Index dédié : le banc comportemental purge sa base, il ne doit pas
      # emporter celle des bancs de pagination.
      NF_REDIS_TEST_URL: redis://:nodefony-dev@127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Redis (mot de passe, comme en développement)
        uses: ./.github/actions/redis

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Le filet est DANS la suite, plus dans ce fichier.
      #
      # Il y a eu ici une étape `jq` qui comptait les cas passés par dialecte,
      # parce qu'une URL mal formée ne fait pas ÉCHOUER ces suites : elle les
      # fait SAUTER, et `npm test` sort vert avec les dialectes muets. La règle
      # était juste ; son emplacement ne l'était pas. Écrite workflow par
      # workflow, elle ne protégeait que les passes où quelqu'un avait pensé à
      # la recopier — et ne disait rien à qui lance la suite en local.
      #
      # Elle vit maintenant dans `vitest.gates.ts`, appelée par la configuration
      # du paquet (`proof: "(postgres)"`) : une seule implémentation, qui exige
      # un cas PASSÉ par dialecte et fait échouer la passe quand `CI` est posé.
      # Voir `docs/guides/integration-continue.md`.
      - name: Drizzle — sqlite + PostgreSQL + MySQL
        working-directory: src/packages/@nodefony/drizzle
        run: npm test

      # Huit mesures qui ne tournaient nulle part — le dernier banc du dépôt à
      # être resté hors de toute passe sans que ce soit un choix.
      #
      # Il n'a pas sa place dans `memory.yml` : celui-ci lance le banc du paquet
      # `http`, qui exige un serveur, alors que celui-ci mesure l'ORM seul sur
      # une base en mémoire. Aucun décor, quelques secondes — et il garde ce
      # qu'aucune autre suite ne regarde : le heap après 30 000 cycles
      # create/find/delete, et 300 connexions ouvertes puis fermées.
      #
      # Le GC forcé est déclaré dans sa propre configuration (`execArgv:
      # ["--expose-gc"]` sur le pool de forks) : sans lui la mesure porterait sur
      # le déchet en attente de collecte, pas sur ce qui est RETENU — l'erreur
      # qui avait fait accuser le mauvais banc côté HTTP.
      - name: Drizzle — charge et heap de l'ORM (base en mémoire)
        working-directory: src/packages/@nodefony/drizzle
        run: npm run test:load

      - name: Redis — serveur réel
        working-directory: src/packages/@nodefony/redis
        run: npm test

      # MongoDB n'était pas une couverture ABSENTE — c'est plus subtil, et c'est
      # pour ça que ça méritait d'être réglé. À défaut de serveur, la suite
      # télécharge un `mongod` éphémère et ses 168 cas tournent quand même. Mais
      # si ce téléchargement échoue — hors ligne, miroir en panne, image sans le
      # binaire — TOUS les bancs d'intégration sautent (`describe.skipIf(!URI)`)
      # et la suite reste VERTE en n'ayant prouvé qu'un schéma Zod.
      #
      # Un vrai serveur supprime la dépendance à un téléchargement au milieu
      # d'une passe, et éprouve le code contre la version qu'on vise vraiment.
      - name: MongoDB (jeu de réplicas, comme en développement)
        uses: ./.github/actions/mongo

      - name: Mongoose — serveur réel
        working-directory: src/packages/@nodefony/mongoose
        env:
          NF_MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm test

      - name: orm-core
        working-directory: src/packages/@nodefony/orm-core
        run: npm test

      # Le JUGE du banc de schéma, éprouvé — pas le banc, qui lance de vrais
      # agents et coûte de l'argent.
      #
      # Il est ICI et non dans `node.js.yml` pour une raison mécanique : son
      # lecteur PostgreSQL ne peut s'exercer que contre une base, et sans elle il
      # sort `2` en ANNONÇANT que le chemin qui juge les vrais runs n'a pas été
      # couvert. Le service tourne déjà dans ce job — l'y brancher ne coûte rien
      # et lui donne le seul décor où son vert veut dire quelque chose.
      #
      # Il existe parce que ce banc a rendu des verdicts faux avec l'aplomb des
      # justes : 18 faux positifs qui noyaient le seul vrai écart, dont le tout
      # premier était dans le CONTRÔLE et non dans le lecteur.
      - name: Gate — auto-contrôle du juge du banc de schéma (PostgreSQL)
        env:
          NF_PG_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony
        run: node .claude/skills/nodefony-devkit-bench/scripts/bench-schema.selftest.mjs

  # ─── La socket distribuée, éprouvée sur de VRAIS process ────────────────────
  #
  # C'est la promesse centrale du framework — « HTTP et WebSocket co-citoyens,
  # jusqu'en cluster » — et elle n'était vérifiée nulle part : les deux bancs qui
  # la portent s'auto-skippent sans `NF_RUN_CLUSTER_E2E`, jamais posé. La garantie
  # la plus structurante du produit reposait donc sur des tests que personne
  # n'exécutait, dans une suite qui sortait verte.
  #
  # Job séparé du précédent : il fork de vrais workers, et cette charge n'a rien à
  # faire dans le même runner qu'une suite qui martèle trois bases.
  realtime:
    name: Socket distribuée (IPC · backplane Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Ouvre les deux bancs e2e. Les MESURES (latence, débit) restent derrière
      # `NF_RUN_PERF`, fermé ici : un banc de mesure sur runner partagé rendrait un
      # chiffre non reproductible, et un seuil non déterministe est un futur
      # rouge qui n'apprend rien.
      NF_RUN_CLUSTER_E2E: "1"
      NF_REDIS_URL: redis://:nodefony-dev@127.0.0.1:6379
      NF_REDIS_TEST_URL: redis://:nodefony-dev@127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: "npm"

      # Le banc IPC n'a besoin de RIEN d'autre que `fork()` ; c'est le banc
      # backplane qui exige un vrai Redis. Les deux vivent dans la même suite.
      - name: Redis (mot de passe, comme en développement)
        uses: ./.github/actions/redis

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Comme pour les dialectes plus haut : le filet qui comptait les cas passés
      # par topologie vit maintenant dans `vitest.config.ts` du paquet, sous
      # forme de `proof`. Les bancs Redis s'auto-skippent quand le serveur est
      # injoignable, le banc IPC quand l'interrupteur manque — les deux silences
      # sont VERTS, et c'est ce que le rapporteur transforme en échec.
      # Voir `docs/guides/integration-continue.md`.
      - name: Realtime — fan-out cross-process (IPC) et cross-pod (Redis)
        working-directory: src/packages/@nodefony/realtime
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # Coupures RÉELLES de base — le seul décor qui prouve ce qu'un driver FAIT
  # quand le serveur tombe. Les suites `outage.test.ts` émettent elles-mêmes
  # l'événement du driver : elles prouvent le câblage EN SUPPOSANT que le driver
  # émettra. Le jour où un `pg` renommera `acquire`, tout resterait vert sans ce
  # job.
  #
  # Pourquoi `docker run` et non `services:` : ces bancs ARRÊTENT le serveur et
  # le relancent — il leur faut donc un NOM stable, que les service containers
  # de GitHub ne donnent pas. C'est le même raisonnement que pour Redis plus
  # haut, poussé d'un cran.
  # ────────────────────────────────────────────────────────────────────────────
  outage:
    name: Coupures réelles de base (PostgreSQL · MySQL · MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Images et identifiants ALIGNÉS sur `docker/docker-compose.yml` : éprouver
      # le code contre une AUTRE version que celle de développement ferait de
      # chaque divergence un mystère.
      NF_PG_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony
      NF_MYSQL_URL: mysql://nodefony:nodefony-dev@127.0.0.1:3306/nodefony
      NF_MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      NF_RUN_DB_OUTAGE: "1"
      NF_DB_OUTAGE_PG_CONTAINER: nf-outage-pg
      NF_DB_OUTAGE_MYSQL_CONTAINER: nf-outage-mysql
      NF_DB_OUTAGE_MONGO_CONTAINER: nf-outage-mongo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: PostgreSQL (conteneur NOMMÉ — les bancs l'arrêtent et le relancent)
        shell: bash
        run: |
          docker run -d --name nf-outage-pg \
            -e POSTGRES_USER=nodefony \
            -e POSTGRES_PASSWORD=nodefony-dev \
            -e POSTGRES_DB=nodefony \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 40); do
            if docker exec nf-outage-pg pg_isready -U nodefony -d nodefony >/dev/null 2>&1; then
              echo "PostgreSQL prêt"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL n'a jamais répondu"; docker logs nf-outage-pg; exit 1

      - name: MariaDB (conteneur nommé)
        shell: bash
        run: |
          docker run -d --name nf-outage-mysql \
            -e MARIADB_ROOT_PASSWORD=nodefony-dev \
            -e MARIADB_USER=nodefony \
            -e MARIADB_PASSWORD=nodefony-dev \
            -e MARIADB_DATABASE=nodefony \
            -p 3306:3306 mariadb:11.4
          for i in $(seq 1 40); do
            if docker exec nf-outage-mysql healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              echo "MariaDB prête"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB n'a jamais répondu"; docker logs nf-outage-mysql; exit 1

      - name: MongoDB en replica set (conteneur nommé)
        uses: ./.github/actions/mongo
        with:
          name: nf-outage-mongo

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # Le contrat portable d'abord : s'il tombe, inutile d'accuser un driver.
      - name: Contrat de résilience (sans infra) et compatibilité d'un adapter tiers
        working-directory: src/packages/@nodefony/orm-core
        run: npx vitest run tests/unit/ormResilience.test.ts tests/unit/ormAdapterCompat.test.ts

      - name: Coupures réelles — PostgreSQL et MySQL
        working-directory: src/packages/@nodefony/drizzle
        # Cette passe ne joue que les DEUX fichiers de coupure, quand le gate du
        # paquet attend les preuves de la suite ENTIÈRE : ses motifs
        # « (postgres) » / « (mysql) » nomment les bancs de CONTRAT, qu'un autre
        # job joue déjà. Sans cette déclaration, une passe qui coupe et relance
        # deux vrais serveurs se voit reprocher de ne pas les avoir exercés.
        # L'absence est donc ÉNONCÉE — le rapport la nomme — et non masquée.
        env:
          NF_GATES_ALLOW: NF_PG_URL,NF_MYSQL_URL
        run: npx vitest run tests/integration/outage.test.ts tests/integration/outage-real.test.ts

      - name: Coupures réelles — MongoDB
        working-directory: src/packages/@nodefony/mongoose
        # Même raison qu'au step précédent : passe filtrée, gate écrit pour la
        # suite entière (il attend ici le banc « MongooseTokenStore — ITokenStore
        # portable »). Ce step-ci ne tombait pas tant que son frère échouait
        # AVANT lui — un rouge en masquait un autre, dans le même job.
        env:
          NF_GATES_ALLOW: NF_MONGO_TEST_URI
        run: npx vitest run tests/integration/outage.test.ts tests/integration/outage-real.test.ts

      # Le banc le plus parlant, et le seul qui parle de POD : les suites ORM
      # éprouvent un connecteur isolé, celui-ci démarre l'application comme en
      # production et coupe sa base. Sans le câblage du pool `pg`, les pods
      # MEURENT (code 1) — mesuré. C'est ce que ce banc empêche de revenir.
      - name: Pods en PRODUCTION face à la chute de leur base (cluster de 2)
        run: node .claude/skills/nodefony-multipod-bench/scripts/db-outage-pod.mjs --workers 2 --container nf-outage-pg
        env:
          NF_DATABASE_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony

      # LE banc qui manquait, et le seul qui franchisse la frontière du CYCLE DE
      # VIE : les suites ORM éprouvent un connecteur sans serveur, le banc e2e
      # éprouve un serveur sans base. Aucun ne disait si une donnée écrite par
      # une requête SURVIT au pod qui l'a écrite — c'est le « ORM Docker
      # persistant » que le tableau de migration déclarait manquant.
      # Il se débranche d'un mot (`--url sqlite::memory:` ⇒ ROUGE), ce qui est
      # la seule preuve qu'il mesure la persistance et non le redémarrage.
      - name: Une donnée écrite par HTTP survit-elle au redémarrage du pod ?
        run: node .claude/skills/nodefony-multipod-bench/scripts/db-persistance-pod.mjs --port 5261
        env:
          NF_DATABASE_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony

      # Un banc qui ARRÊTE des serveurs peut laisser le décor en vrac : dire ce
      # qu'on rend permet de distinguer « le test a échoué » de « le décor a
      # disparu en route ».
      - name: État final du décor
        if: always()
        run: docker ps -a --format "{{.Names}} {{.Status}}"
