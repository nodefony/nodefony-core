name: Bancs sur infrastructure réelle

# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI CE WORKFLOW EXISTE
#
# `npm test` sur @nodefony/drizzle laisse 442 tests sur 781 NON EXÉCUTÉS — soit
# les deux dialectes de PRODUCTION, PostgreSQL et MySQL — et sort vert quand
# même : un test sauté ne bloque pas. Le vert par défaut ne prouvait donc que
# sqlite, sans jamais le dire. Même silence côté Redis (15 cas muets faute d'URL).
#
# Ces suites savent parler à un vrai serveur ; il ne leur manquait qu'un serveur.
# Les variables attendues et leur forme sont définies une seule fois, dans
# `vitest.gates.ts` à la racine — ce fichier les POSE, il ne les invente pas.
#
# Le second job traite le même mal sur ce que le framework promet de plus
# structurant : une socket distribuée en cluster. Les deux bancs qui l'éprouvent
# — fan-out cross-process par IPC, fan-out cross-pod par le backplane Redis —
# s'auto-skippaient faute d'un interrupteur que personne ne posait. La garantie
# la plus centrale du produit reposait donc sur des tests jamais exécutés.
#
# POURQUOI UN WORKFLOW SÉPARÉ, ET FILTRÉ PAR CHEMIN
#
#  · `paths:` — démarrer trois bases pour un changement de feuille de style est
#    une dépense sans contrepartie. Ce workflow ne s'éveille que si un paquet qui
#    parle à un store a bougé. C'est ce filtre, et non une restriction de branche,
#    qui garde la boucle de développement courte : réserver ces bancs à `main`
#    reviendrait à découvrir la casse après le merge, quand elle coûte le plus.
#  · séparé — il tourne EN PARALLÈLE du workflow principal, qu'il n'allonge pas,
#    et un décor d'infra défaillant n'y teint pas en rouge des jobs qui n'ont
#    rien à voir.
#  · Ubuntu seulement — contrainte de la plateforme, pas un choix : les service
#    containers exigent un runner Linux. Ce qui est éprouvé ici est du SQL et un
#    protocole, pas un comportement de système de fichiers.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/drizzle/**"
      - "src/packages/@nodefony/redis/**"
      - "src/packages/@nodefony/orm-core/**"
      - "src/packages/@nodefony/realtime/**"
      - "src/nodefony/src/tests/support/**"
      - "vitest.gates.ts"
      - ".github/workflows/orm.yml"
  pull_request:
    branches: ["main", "claude-ts"]
    paths:
      - "src/packages/@nodefony/drizzle/**"
      - "src/packages/@nodefony/redis/**"
      - "src/packages/@nodefony/orm-core/**"
      - "src/packages/@nodefony/realtime/**"
      - "src/nodefony/src/tests/support/**"
      - "vitest.gates.ts"
      - ".github/workflows/orm.yml"
  # Rattrapage manuel : un changement transverse peut casser ces suites sans
  # toucher aucun des chemins ci-dessus.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true
  FORCE_COLOR: 1

jobs:
  stores:
    name: Stores (PostgreSQL · MariaDB · Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Images, identifiants et sondes de santé ALIGNÉS sur `docker/docker-compose.yml`.
    # Deux décors pour une même cible ne peuvent pas être fusionnés — compose n'est
    # pas lisible par `services:` — donc la seule protection contre la dérive est
    # qu'ils échouent ensemble : une suite qui passe ici et pas en local (ou
    # l'inverse) est le signal que ces deux listes ont divergé.
    #
    # Les sondes ne sont pas décoratives : GitHub attend qu'un service soit SAIN
    # avant de lancer la moindre étape. Sans elles, la suite démarrerait avant la
    # base et rendrait un rouge qui parle de connexion refusée au lieu du code —
    # le faux négatif classique de ce genre de décor.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodefony
          POSTGRES_PASSWORD: nodefony-dev
          POSTGRES_DB: nodefony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodefony -d nodefony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nodefony-dev
          MARIADB_USER: nodefony
          MARIADB_PASSWORD: nodefony-dev
          MARIADB_DATABASE: nodefony
        ports:
          - 3306:3306
        # `healthcheck.sh` est l'outil officiel de l'image mariadb ; `--innodb_initialized`
        # attend l'initialisation du moteur, pas seulement l'ouverture du port.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Redis n'est PAS ici : il lui faut `redis-server --requirepass …`, et
      # `services:` ne sait pas passer d'arguments au conteneur — `options` est
      # inséré dans `docker create` AVANT l'image, donc `--requirepass` y est lu
      # comme une option docker et la création échoue (exit 125, constaté).
      # Le mot de passe n'est pas négociable : les bancs se connectent avec, et un
      # serveur sans authentification les ferait échouer sur « AUTH sans mot de
      # passe configuré ». Il est donc démarré en étape, plus bas.

    env:
      # Forme des URL : `vitest.gates.ts` (source unique). Le job tourne sur le
      # runner, pas dans un conteneur → les services sont joints par 127.0.0.1
      # sur les ports publiés ci-dessus.
      NF_PG_URL: postgres://nodefony:nodefony-dev@127.0.0.1:5432/nodefony
      NF_MYSQL_URL: mysql://nodefony:nodefony-dev@127.0.0.1:3306/nodefony
      REDIS_URL: redis://:nodefony-dev@127.0.0.1:6379
      # Index dédié : le banc comportemental purge sa base, il ne doit pas
      # emporter celle des bancs de pagination.
      REDIS_TEST_URL: redis://:nodefony-dev@127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: Redis (mot de passe, comme en développement)
        uses: ./.github/actions/redis

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # DEUX rapporteurs : `--reporter=json` seul REMPLACE la sortie lisible, et un
      # échec ne dit alors plus quel dialecte ni sur quelle assertion.
      - name: Drizzle — sqlite + PostgreSQL + MySQL
        working-directory: src/packages/@nodefony/drizzle
        run: |
          npm test -- \
            --reporter=default --reporter=json --outputFile=stores-report.json

      # FILET — la raison d'être de ce workflow, donc son point le plus fragile.
      # Une URL mal formée ne fait pas ÉCHOUER ces suites : elle les fait
      # SAUTER, et `npm test` sort vert avec les dialectes muets — précisément le
      # silence qu'on vient de payer. Compter les cas qui ont réellement tourné
      # par dialecte est la seule affirmation qui ne peut pas être satisfaite par
      # un décor absent.
      #
      # Le compte n'est pas comparé à un plancher chiffré (qui se périmerait au
      # premier test ajouté) mais à zéro : la question posée est « ce dialecte
      # a-t-il été exercé », pas « combien de fois ».
      - name: Les dialectes de PRODUCTION ont réellement tourné
        working-directory: src/packages/@nodefony/drizzle
        run: |
          count() {
            jq --arg d "$1" '[.testResults[].assertionResults[]
              | select(.status == "passed")
              | select(.fullName | contains("(" + $d + ")"))] | length' stores-report.json
          }
          pg=$(count postgres)
          my=$(count mysql)
          echo "PostgreSQL : $pg cas · MySQL/MariaDB : $my cas"
          if [ "$pg" -eq 0 ] || [ "$my" -eq 0 ]; then
            echo "::error::Un dialecte de production n'a PAS été exercé (postgres=$pg, mysql=$my) — le décor n'a pas été joint, et le vert ci-dessus ne prouve que sqlite."
            jq -r '.numPendingTests as $p | "tests sautés : \($p)"' stores-report.json
            exit 1
          fi

      - name: Redis — serveur réel
        working-directory: src/packages/@nodefony/redis
        run: npm test

      - name: orm-core
        working-directory: src/packages/@nodefony/orm-core
        run: npm test

  # ─── La socket distribuée, éprouvée sur de VRAIS process ────────────────────
  #
  # C'est la promesse centrale du framework — « HTTP et WebSocket co-citoyens,
  # jusqu'en cluster » — et elle n'était vérifiée nulle part : les deux bancs qui
  # la portent s'auto-skippent sans `RUN_CLUSTER_E2E`, jamais posé. La garantie
  # la plus structurante du produit reposait donc sur des tests que personne
  # n'exécutait, dans une suite qui sortait verte.
  #
  # Job séparé du précédent : il fork de vrais workers, et cette charge n'a rien à
  # faire dans le même runner qu'une suite qui martèle trois bases.
  realtime:
    name: Socket distribuée (IPC · backplane Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Ouvre les deux bancs e2e. Les MESURES (latence, débit) restent derrière
      # `RUN_PERF`, fermé ici : un banc de mesure sur runner partagé rendrait un
      # chiffre non reproductible, et un seuil non déterministe est un futur
      # rouge qui n'apprend rien.
      RUN_CLUSTER_E2E: "1"
      REDIS_URL: redis://:nodefony-dev@127.0.0.1:6379
      REDIS_TEST_URL: redis://:nodefony-dev@127.0.0.1:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      # Le banc IPC n'a besoin de RIEN d'autre que `fork()` ; c'est le banc
      # backplane qui exige un vrai Redis. Les deux vivent dans la même suite.
      - name: Redis (mot de passe, comme en développement)
        uses: ./.github/actions/redis

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      # DEUX rapporteurs : `--reporter=json` seul REMPLACE la sortie lisible, et un
      # échec ne dit alors plus quel cas ni pourquoi.
      - name: Realtime — fan-out cross-process (IPC) et cross-pod (Redis)
        working-directory: src/packages/@nodefony/realtime
        run: |
          npm test -- \
            --reporter=default --reporter=json --outputFile=realtime-report.json

      # FILET — le banc Redis s'auto-skippe quand le serveur est injoignable, et
      # le banc IPC quand la variable manque. Les deux silences sont VERTS. Exiger
      # que chaque topologie ait réellement produit des cas passés est la seule
      # affirmation qu'un décor absent ne peut pas satisfaire.
      - name: Les deux topologies ont réellement tourné
        working-directory: src/packages/@nodefony/realtime
        run: |
          count() {
            jq --arg d "$1" '[.testResults[].assertionResults[]
              | select(.status == "passed")
              | select(.fullName | contains($d))] | length' realtime-report.json
          }
          ipc=$(count "e2e cluster IPC")
          # DEUX bancs parlent à un vrai Redis, et il faut compter les deux : le
          # cross-PROCESS (`redisCluster.e2e.test.ts`, derrière RUN_CLUSTER_E2E) et
          # l'intégration en process unique sur vraies connexions
          # (`integration/RedisBackplane.test.ts`, gardé seulement par la joignabilité
          # de Redis) — ce dernier porte la matrice d'attaque F83 : injection tierce,
          # sceau, secret volé. Ne compter que le premier faisait conclure « une seule
          # preuve cross-pod » alors que six autres tournaient déjà.
          redis=$(count "e2e cluster Redis")
          reel=$(count "RedisBackplane — intégration")
          f83=$(count "F83 — injection tierce")
          echo "IPC : $ipc · cross-process Redis : $redis · intégration Redis : $reel · attaques F83 : $f83"
          if [ "$ipc" -eq 0 ] || [ "$redis" -eq 0 ] || [ "$reel" -eq 0 ] || [ "$f83" -eq 0 ]; then
            echo "::error::Une topologie n'a PAS été éprouvée (ipc=$ipc, cross-process=$redis, intégration=$reel, F83=$f83) — le vert ci-dessus ne prouve pas la socket distribuée."
            exit 1
          fi
