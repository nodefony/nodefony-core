# Publie le dossier « Performance » sur GitHub Pages — une page par version.
#
# CE QUE CE FLUX NE FAIT PAS : mesurer. Un exécuteur partagé rend des chiffres
# faux, et le dépôt a déjà payé cette leçon (aucun absolu pris derrière un chemin
# virtualisé n'est transposable). La mesure est un geste MANUEL, sur une machine
# nommée, dont le résultat est commité dans `docs/performance/data/<version>.json`
# — cf `docs/release/nodefony-10.md`. Ici on ne fait que RENDRE ces données, donc
# le résultat ne dépend pas de la machine qui l'exécute.
#
# Prérequis, une seule fois : Settings → Pages → Source = « GitHub Actions ».
name: Performance — publication des mesures

on:
  push:
    branches: [main, claude-ts]
    paths:
      - "docs/performance/data/**"
      - "scripts/build-perf-site.mjs"
      - ".claude/skills/nodefony-load-test/scripts/prod-readiness-report.mjs"
      - ".claude/skills/nodefony-html-report/lib/report.mjs"
      - ".github/workflows/perf-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en vol.
concurrency:
  group: perf-pages
  cancel-in-progress: false

jobs:
  build:
    name: Rendre le site depuis les mesures versionnées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      # 🔴 Le moteur de figures a besoin d'Apache ECharts, qui rend le SVG côté
      # serveur. Cette étape a longtemps été absente, à raison : la bibliothèque
      # de rendu n'importait alors rien hors de `node:`. Le jour où le moteur est
      # arrivé, la publication a échoué ici — proprement, sur le message qui
      # nomme la commande à taper, et SANS rien publier de tronqué.
      # `--ignore-scripts` : aucune dépendance de build de ce dépôt n'a besoin de
      # compiler quoi que ce soit pour rendre des pages.
      - name: Installer les dépendances de rendu
        run: npm ci --ignore-scripts

      # Sous `performance/`, jamais à la racine : le domaine Pages de ce dépôt
      # servira d'autres choses (la documentation, d'abord). Une URL publiée ne se
      # change plus sans casser les liens de ceux qui l'ont citée — c'est donc
      # maintenant, avant la première publication, que la place se décide.
      - name: Construire le site
        run: node scripts/build-perf-site.mjs --out dist-perf-site/performance

      - name: Page d'accueil — pointer vers la section
        run: |
          printf '%s\n' \
            '<!doctype html><html lang="fr"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./performance/">' \
            '<title>Nodefony</title></head><body>' \
            '<p><a href="./performance/">Performance de Nodefony</a></p>' \
            '</body></html>' > dist-perf-site/index.html

      # Le site doit MONTRER quelque chose : une page vide se publierait en silence.
      - name: Vérifier qu'il y a bien une page courante
        run: test -s dist-perf-site/performance/latest/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-perf-site

  deploy:
    name: Déployer sur Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
