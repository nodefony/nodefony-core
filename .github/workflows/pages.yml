# Publie le site Nodefony sur GitHub Pages — l'accueil à la racine, la
# documentation sous `/docs/`, les mesures sous `/performance/` — et ce, pour
# PLUSIEURS versions à la fois :
#
#   /                 la version PUBLIÉE sur npm, bâtie depuis `main`
#   /next/            la branche `dev`, avec bandeau « pas encore publié »
#   /<version>/       chaque release archivée, telle qu'elle était à sa sortie
#
# Un sélecteur dans l'en-tête de chaque page passe de l'une à l'autre
# (`scripts/site/lib/site-versions.mjs`).
#
# POURQUOI LA RACINE VIENT DE `main` ET PAS DE L'ARCHIVE DE LA RELEASE. `main`
# n'avance qu'aux releases : elle porte ce qui est publié. Une correction du
# RENDU (schéma, mise en page) s'y reporte par cherry-pick et se voit le jour
# même, sans attendre la release suivante. L'archive, elle, ne change plus
# jamais : c'est l'adresse permanente de la version.
#
# POURQUOI UN RUN DE `dev` DEMANDE UN RUN DE `main`. L'environnement
# `github-pages` n'autorise que `main` ; `/next/` ne peut donc être mis en ligne
# que par un run porté par `main`, qui récupère `dev` dans un second dossier.
# Un push sur `dev` bâtit et éprouve SON site ici, puis demande ce run
# (`workflow_dispatch`, seul événement que le `GITHUB_TOKEN` a le droit de
# déclencher). La racine n'en bouge pas : elle se rebâtit depuis `main`.
#
# POURQUOI UN SEUL FLUX POUR DEUX SITES. GitHub Pages ne connaît qu'UN artefact,
# et chaque déploiement REMPLACE l'intégralité du site. Deux flux séparés ne se
# compléteraient donc pas : la documentation effacerait les mesures, puis les
# mesures effaceraient la documentation, à chaque exécution. Ce n'est pas un
# réglage à trouver, c'est le fonctionnement de `deploy-pages` — d'où ce flux
# unique, qui bâtit les deux et les déploie ensemble.
#
# CE QUE CE FLUX NE FAIT PAS : mesurer, ni rédiger. Un exécuteur partagé rend des
# chiffres faux, et le dépôt a déjà payé cette leçon (aucun absolu pris derrière
# un chemin virtualisé n'est transposable). La mesure est un geste MANUEL, sur
# une machine nommée, dont le résultat est commité dans
# `docs/performance/data/<version>.json`. La documentation, elle, vit en Markdown
# aux vrais chemins. Ici on ne fait que RENDRE — le résultat ne dépend donc pas
# de la machine qui l'exécute.
#
# Prérequis, une seule fois : Settings → Pages → Source = « GitHub Actions ».
name: Site — documentation et mesures

#
# 🔴 IL N'Y A PAS DE DÉCLENCHEUR `release`, ET C'EST DÉLIBÉRÉ. Il a existé, avec
# le commentaire « le site reflète la version sortie » — il n'a JAMAIS tiré, cent
# runs de suite, sans que rien ne le signale. Deux causes indépendantes, chacune
# suffisante à elle seule :
#   1. `release.yml` crée la Release avec le `GITHUB_TOKEN`, et les événements
#      produits par ce jeton ne déclenchent aucun workflow — protection contre
#      les boucles infinies, sans interrupteur ;
#   2. l'environnement `github-pages` n'autorise le déploiement que depuis
#      `main` : un run porté par le TAG bâtirait tout le site, puis se ferait
#      refuser au dernier pas.
# CE QUI LE REMPLACE : `release.yml`, job `annonce`, appelle ce flux
# EXPLICITEMENT — `gh workflow run pages.yml --ref main` — juste après avoir créé
# la Release. `workflow_dispatch` est l'EXCEPTION documentée à la règle du jeton
# (« With the exception of `workflow_dispatch` and `repository_dispatch`, other
# `GITHUB_TOKEN`-triggered events do not create workflow runs at all ») : c'est
# ce qui rend le déclencheur ci-dessous fonctionnel là où `release` ne l'était
# pas. Un appel se lit dans le fichier qui le fait ; un déclencheur muet, non.
on:
  # Un correctif de page part en ligne sans attendre la prochaine release.
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "src/nodefony/docs/**"
      - "src/packages/@nodefony/*/docs/**"
      # Tout le dossier : chaque fichier y sert le site (rendu, coloration,
      # liens, plan). Les nommer un par un en laissait quatre dehors — une
      # modification ne republiait pas le site.
      - "scripts/site/**"
      - "scripts/lib/**"
      # Le générateur n'est plus seul à décider du site : il importe du module de
      # documentation le moteur de RECHERCHE (sérialisé dans chaque page) et le
      # PÉRIMÈTRE publié. Changer ces règles change le site — sans ce chemin, la
      # republication n'aurait pas lieu et le site garderait l'ancienne recherche.
      - "src/packages/@nodefony/documentation/nodefony/**"
      - "src/packages/@nodefony/documentation/index.ts"
      # Le plan du site AFFIRME ce qu'une application installe, en le lisant dans
      # le gabarit. Une dépendance ajoutée là change donc une page publiée.
      - "src/nodefony/templates/app/base/package.json.tpl"
      - "README.md"
      - ".claude/skills/nodefony-html-report/lib/**"
      - ".claude/skills/nodefony-documentation/lib/**"
      - ".claude/skills/nodefony-load-test/scripts/prod-readiness-report.mjs"
      - ".claude/skills/nodefony-load-test/scripts/perf-dossier-report.mjs"
      - ".github/workflows/pages.yml"
  # Le point d'entrée de la republication : appelé par `release.yml` (voir
  # ci-dessus), et disponible à la main quand le site doit repartir sans commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en vol.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Rendre le site depuis les sources versionnées
    runs-on: ubuntu-latest
    env:
      # Sur `main`, la racine est la version publiée et `/next/` vient de `dev`.
      # Ailleurs, le run éprouve le site de SA branche : il est bâti sous les
      # deux canaux depuis la même source, assemblé, contrôlé — jamais déployé.
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"

      # 🔴 Deux besoins de rendu, et deux leçons déjà payées. Apache ECharts rend
      # les figures en SVG côté serveur ; `markdown-it` transforme les pages. Ce
      # dernier n'existait longtemps que par transitivité de `typedoc` — un bump
      # aurait emporté le rendu de la documentation sans qu'aucun test ne bouge.
      # `--ignore-scripts` : rien ici n'a besoin de compiler quoi que ce soit.
      #
      # Le générateur de documentation consomme la surface PUBLIÉE de
      # `@nodefony/documentation` (scan, slugs, réécriture des liens) — la même
      # que verrait une application qui l'installe. Elle exige donc un paquet
      # bâti ; sans cette étape, le générateur s'arrête en nommant cette commande.
      #
      # Le graphe symbolique n'est pas versionné : l'accueil en lit le compteur,
      # qui s'afficherait « — » sans un mot s'il manquait.
      - name: Préparer le rendu (dépendances, module de documentation, symboles)
        run: |
          npm ci --ignore-scripts
          npx turbo run build --filter=@nodefony/documentation
          npm run generate-symbols

      # Le lecteur mermaid du moteur jette en silence une flèche qu'il ne
      # reconnaît pas : le schéma se rend quand même, amputé. Ses formes de
      # flèche sont éprouvées AVANT de publier cent schémas avec lui.
      - name: Éprouver le lecteur de schémas
        run: node .claude/skills/nodefony-html-report/scripts/schemas.selftest.mjs

      # La séquence d'un rendu complet (accueil, documentation, mesures, qualité,
      # plan) vit dans `build-site.mjs` : elle sert ici, sous `/next/` et à
      # l'archive d'une release — une seule copie.
      - name: Rendre la version publiée
        run: node scripts/site/build-site.mjs --out dist-published --channel published

      # Sur `dev`, la même source sous le canal `next` : c'est ce que `/next/`
      # montrera, bandeau compris, et son contrôle de liens ne se fait que sur le
      # site assemblé (le bandeau remonte vers la racine).
      - name: Rendre la branche courante sous /next/ (hors main)
        if: env.ON_MAIN != 'true'
        run: node scripts/site/build-site.mjs --out dist-next --channel next

      # Sur `main`, `/next/` vient de `dev` — une SECONDE copie du dépôt, bâtie
      # par SON propre outillage : c'est le site que `dev` décrit, pas celui que
      # l'outillage de `main` en ferait.
      - name: Récupérer dev pour /next/ (main)
        if: env.ON_MAIN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: next-src
      - name: Rendre dev sous /next/ (main)
        if: env.ON_MAIN == 'true'
        working-directory: next-src
        run: |
          npm ci --ignore-scripts
          npx turbo run build --filter=@nodefony/documentation
          npm run generate-symbols
          node scripts/site/build-site.mjs --out "$GITHUB_WORKSPACE/dist-next" --channel next

      # Chaque release a archivé son site (`release.yml`, job `annonce`) :
      # on le REMET tel quel, sans rien rebâtir — un vieux tag passerait par le
      # générateur d'aujourd'hui, et la page ne serait plus celle publiée. Une
      # release sans archive (antérieure au versionnement) est simplement
      # absente du sélecteur. Le nom de chaque dossier est contrôlé à
      # l'assemblage : seul un numéro de version devient un dossier du site.
      - name: Récupérer les sites archivés des releases (main)
        if: env.ON_MAIN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p archives-tgz archives
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'site-*.tar.gz' --dir archives-tgz 2>/dev/null \
              || echo "  $tag : pas d'archive de site"
          done
          shopt -s nullglob
          for f in archives-tgz/site-*.tar.gz; do
            v=$(basename "$f" .tar.gz); v=${v#site-}
            mkdir -p "archives/$v"
            tar -xzf "$f" -C "archives/$v"
          done
          echo "archives : $(ls archives | tr '\n' ' ')"

      - name: Assembler les versions
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$ON_MAIN" = "true" ]; then extra=(--archives archives); fi
          node scripts/site/assemble-site.mjs --published dist-published \
            --next dist-next --out dist-site "${extra[@]}"

      # Le site doit MONTRER quelque chose : une page vide se publierait en
      # silence. On exige la porte d'entrée, une page profonde et la page de
      # mesures courante — trois points qui tombent pour trois raisons distinctes
      # — à la racine ET sous `/next/`, plus le manifeste du sélecteur.
      - name: Vérifier que le site n'est pas vide
        shell: bash
        run: |
          for d in dist-site dist-site/next; do
            test -s $d/index.html
            test -s $d/docs/index.html
            test -s $d/docs/modules/security/firewall/index.html
            test -s $d/docs/modules/security/firewall/index.md
            test -s $d/performance/latest/index.html
            test -s $d/versions.json
          done
          test -s dist-site/404.html
          test -s dist-site/llms.txt
          test -s dist-site/sitemap.xml
          test -s dist-site/robots.txt
          # Le plan décrit la version installable : `/next/` n'y figure pas.
          if grep -q '/next/' dist-site/sitemap.xml; then
            echo "::error::sitemap.xml cite /next/ — le plan doit décrire la version publiée"
            exit 1
          fi
          grep -q 'nf-next-banner' dist-site/next/docs/index.html
          echo "pages rendues : $(find dist-site -name index.html | wc -l)"

      # La recherche plein texte tient à DEUX artefacts, et perdre l'un des deux
      # ne casse rien de visible : la page se charge, le champ répond, et il ne
      # trouve simplement plus rien. On exige donc l'index ET le moteur inséré
      # dans la page, plus une vraie interrogation — un index vide pèse quelques
      # octets et passerait un simple test d'existence.
      - name: Vérifier que la recherche est servie, et qu'elle trouve
        shell: bash
        run: |
          test -s dist-site/docs/search-index.json
          grep -q "window.__nfSearch" dist-site/docs/index.html
          node -e '
            const fs = require("fs");
            const page = fs.readFileSync("dist-site/docs/index.html", "utf8");
            const m = /window\.__nfSearch=(function searchDocs[\s\S]*?);<\/script>/.exec(page);
            if (!m) throw new Error("moteur de recherche absent de la page");
            const chercher = new Function("return (" + m[1] + ")")();
            const index = JSON.parse(
              fs.readFileSync("dist-site/docs/search-index.json", "utf8"),
            );
            const r = chercher(index.docs, "firewall", 5);
            if (!r.hits.length) throw new Error("la recherche ne rend AUCUN résultat");
            console.log(
              `recherche : ${index.docs.length} pages indexées, ` +
                `« firewall » → ${r.matched} pages`,
            );
          '

      # Un lien mort ne se voit qu'une fois en ligne, et le site est servi sous
      # un sous-chemin (`/nodefony-core/`) : ses liens sont donc RELATIFS, et
      # cette garde est ce qui prouve qu'ils le sont restés — sur le site
      # ASSEMBLÉ, archives comprises, puisque c'est lui qui part en ligne.
      - name: Refuser un lien interne cassé
        run: node scripts/site/check-site-links.mjs dist-site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  deploy:
    name: Déployer sur Pages
    needs: build
    # 🔴 LE SITE EN LIGNE SE DÉPLOIE DEPUIS `main`, JAMAIS DEPUIS `dev`.
    # Sur `dev`, tout ce qui précède tourne quand même : le site est BÂTI et ses
    # gardes mordent (site non vide, recherche servie, aucun lien interne cassé).
    # Seule la mise en ligne est retenue — `dev` n'atteint le public que sous
    # `/next/`, par le run de `main` que le job `next` ci-dessous demande. Un
    # lecteur qui arrive de npmjs.com trouve ainsi à la racine la documentation
    # de ce qu'il peut installer, exactement ce que #257 a corrigé dans les README.
    #
    # ⚠️ Cette règle vit ICI, dans le produit, et pas seulement dans la politique
    # de branches de l'environnement `github-pages`. Ce réglage-là est invisible
    # depuis le dépôt : il a nommé pendant des mois une branche de travail qui
    # n'existe plus, sans que rien ne le signale, parce qu'elle était alignée sur
    # `main`. Un garde qu'on ne lit pas dans le code n'en est pas un.
    #
    # ⚠️ Constaté sur le dépôt, et c'est le SECOND filet : l'environnement
    # `github-pages` porte une politique de branche qui n'autorise que `main`.
    # Un run porté par un tag ou par `dev` serait donc refusé ICI de toute façon
    # — mais avec une erreur de plateforme, à la dernière étape, après avoir tout
    # bâti. La condition ci-dessous fait tomber le cas plus tôt, et surtout elle
    # se LIT dans le dépôt.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  next:
    name: Mettre /next/ à jour — demander le run de main
    needs: build
    # Seul un run de `main` déploie : c'est lui qui récupère `dev` pour `/next/`.
    # `workflow_dispatch` est l'exception documentée à la règle du jeton (les
    # autres événements produits par le `GITHUB_TOKEN` ne déclenchent rien).
    # Le groupe de concurrence `pages` ne garde qu'UN run en attente : une rafale
    # de pushes sur `dev` ne produit qu'un déploiement de plus.
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Demander la republication depuis main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run pages.yml --ref main
          echo "site : republication demandée depuis main (/next/ ← dev)"
