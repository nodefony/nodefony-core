# Thème de connexion Nodefony — habille le parcours Keycloak aux couleurs de
# la console d'administration (Nodefony Studio).
#
# HÉRITE de `keycloak.v2` : seules l'enveloppe de la page (template.ftl), une
# feuille de style et les textes de marque sont posés ici. Les ~40 formulaires
# du parcours (mot de passe, mot de passe oublié, double facteur, profil,
# erreurs…) restent ceux de Keycloak, donc justes à chaque mise à jour.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/nodefony.css
