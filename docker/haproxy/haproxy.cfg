# haproxy — proxy de test pour Nodefony (Forwarded RFC 7239 + X-Forwarded-* +
# re-encrypt TLS validé).
#
# Objectif du banc : exercer (1) le parsing du header `Forwarded` (RFC 7239) +
# X-Forwarded-* + from-right, et (2) le LIEN DE FORWARD CHIFFRÉ validé.
# Deux frontends :
#   - :8081 (clair)  → proto=http,  re-encrypt vers 5152 (verify required).
#   - :8443 (TLS)    → proto=https, re-encrypt vers 5152 → scheme client E2E.
# Backend re-chiffré vers 5152 avec validation COMPLÈTE de la chaîne + du nom.
# Nodefony tourne sur l'HÔTE ; lancer NF_BIND_ALL=1 puis
# `bash docker/certs/build-haproxy-pem.sh` avant le `compose up`.

global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client  1m
  timeout server  1m

frontend fe_nodefony
  bind *:8081

  # ---- SÉCU : effacer les en-têtes forwarded entrants (forgés client) -------
  # RFC 7239 §8.1 — un `Forwarded` entrant ne peut pas être cru. En proxy de
  # bordure, on l'EFFACE avant de poser le nôtre (on réécrit une valeur propre).
  http-request del-header Forwarded

  # ---- X-Forwarded-* de-facto ----------------------------------------------
  # `option forwardfor` ajoute X-Forwarded-For avec l'IP source réelle (%[src]).
  # Comme nginx, il APPEND si un X-Forwarded-For existe → exerce le from-right.
  option forwardfor
  http-request set-header X-Forwarded-Proto http
  http-request set-header X-Forwarded-Host  %[req.hdr(host)]
  http-request set-header X-Real-IP         %[src]

  # ---- Forwarded RFC 7239 (header STANDARD) --------------------------------
  # §4 syntaxe : forwarded-pair = token "=" value, paires ";"-séparées.
  # §5 paramètres : for=<client>, by=<interface proxy>, proto=<scheme>, host=<host>.
  # NB : IPv4 en clair OK ; un IPv6 DEVRAIT être quoté + entre crochets
  #      (for="[2001:db8::1]", §4) — non géré ici (banc IPv4 loopback).
  # NB §8.3 : en prod, `for`/`by` SHOULD être obfusqués (for=_xxxx) ; ici on
  #      expose l'IP volontairement pour valider la résolution serveur.
  http-request set-header Forwarded "for=%[src];by=%[dst];proto=http;host=%[req.hdr(host)]"

  # Host forcé sur le domaine canonique APRÈS la capture du host client (les
  # X-Forwarded-Host / Forwarded host= ci-dessus gardent le host d'origine) →
  # le backend voit toujours le vhost nodefony.com (doit être dans trustedHosts).
  http-request set-header host nodefony.com

  default_backend be_nodefony

# Frontend TLS (port 8443) — le proxy TERMINE le TLS côté client (il présente le
# cert nodefony.com via `crt`), pose proto=https, puis RE-CHIFFRE vers le backend.
# Exerce le scheme client END-TO-END : `proto=https` doit arriver jusqu'au backend
# (cf forwarded.ts → context.scheme=https, cookie __Host- OK, getFullUrl https).
# Client : `curl --cacert docker/certs/ca.pem --resolve nodefony.com:8443:127.0.0.1
#           https://nodefony.com:8443/...` (validation propre, sans -k).
frontend fe_nodefony_tls
  bind *:8443 ssl crt /etc/haproxy/certs/haproxy.pem

  http-request del-header Forwarded
  option forwardfor
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host  %[req.hdr(host)]
  http-request set-header X-Real-IP         %[src]
  http-request set-header Forwarded "for=%[src];by=%[dst];proto=https;host=%[req.hdr(host)]"
  http-request set-header host nodefony.com

  default_backend be_nodefony

backend be_nodefony
  # LIEN DE FORWARD CHIFFRÉ (re-encrypt) avec VALIDATION COMPLÈTE — la vraie
  # protection (≠ nginx qui forward en CLAIR vers 5151, lien interne de confiance).
  # haproxy RE-CHIFFRE vers le port HTTPS/2 (5152) : cas où le proxy/PoP est
  # AILLEURS dans le réseau → le segment proxy→Nodefony ne doit JAMAIS circuler en
  # clair. Nodefony joint par son NOM DE DOMAINE (nodefony.com → host-gateway via
  # extra_hosts). Bind serveur 0.0.0.0 requis (NF_BIND_ALL=1).
  #
  # CHAÎNE DE CERTIFICATION — validée (≠ ancien `verify none` illusoire) :
  #   - ca-file        : la CA qui a signé le cert backend (mkcert rootCA, fournie
  #                      par `bash docker/certs/build-haproxy-pem.sh`).
  #   - verify required: refuse le forward si le cert backend n'est pas signé par
  #                      cette CA (anti-MITM sur le lien re-encrypt).
  #   - verifyhost     : exige que le SAN du cert backend couvre `nodefony.com`
  #                      (sinon un cert valide pour TOUT autre nom passerait).
  #   - sni str(...)   : SNI envoyé au backend (sélection du bon cert côté serveur).
  # Pré-requis : Nodefony lancé avec NF_BIND_ALL=1 (SAN=nodefony.com) PUIS
  # `bash docker/certs/build-haproxy-pem.sh`. cf README §TLS du forward.
  server nodefony nodefony.com:5152 check ssl ca-file /etc/haproxy/certs/ca.pem verify required verifyhost nodefony.com sni str(nodefony.com)
