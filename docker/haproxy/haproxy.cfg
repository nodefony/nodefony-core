# haproxy — proxy de test pour Nodefony (en-tête STANDARD Forwarded RFC 7239
# + X-Forwarded-* de-facto).
#
# Objectif du banc : exercer le parsing du header `Forwarded` (RFC 7239, étape
# #2 du chantier forwarded/proxy) EN PLUS des X-Forwarded-*, et le from-right
# serveur. Le serveur Nodefony tourne sur l'HÔTE (port 5151).

global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client  1m
  timeout server  1m

frontend fe_nodefony
  bind *:8081

  # ---- SÉCU : effacer les en-têtes forwarded entrants (forgés client) -------
  # RFC 7239 §8.1 — un `Forwarded` entrant ne peut pas être cru. En proxy de
  # bordure, on l'EFFACE avant de poser le nôtre (on réécrit une valeur propre).
  http-request del-header Forwarded

  # ---- X-Forwarded-* de-facto ----------------------------------------------
  # `option forwardfor` ajoute X-Forwarded-For avec l'IP source réelle (%[src]).
  # Comme nginx, il APPEND si un X-Forwarded-For existe → exerce le from-right.
  option forwardfor
  http-request set-header X-Forwarded-Proto http
  http-request set-header X-Forwarded-Host  %[req.hdr(host)]
  http-request set-header X-Real-IP         %[src]

  # ---- Forwarded RFC 7239 (header STANDARD) --------------------------------
  # §4 syntaxe : forwarded-pair = token "=" value, paires ";"-séparées.
  # §5 paramètres : for=<client>, by=<interface proxy>, proto=<scheme>, host=<host>.
  # NB : IPv4 en clair OK ; un IPv6 DEVRAIT être quoté + entre crochets
  #      (for="[2001:db8::1]", §4) — non géré ici (banc IPv4 loopback).
  # NB §8.3 : en prod, `for`/`by` SHOULD être obfusqués (for=_xxxx) ; ici on
  #      expose l'IP volontairement pour valider la résolution serveur.
  http-request set-header Forwarded "for=%[src];by=%[dst];proto=http;host=%[req.hdr(host)]"

  # Host forcé sur le domaine canonique APRÈS la capture du host client (les
  # X-Forwarded-Host / Forwarded host= ci-dessus gardent le host d'origine) →
  # le backend voit toujours le vhost nodefony.com (doit être dans trustedHosts).
  http-request set-header host nodefony.com

  default_backend be_nodefony

backend be_nodefony
  # LIEN DE FORWARD CHIFFRÉ (re-encrypt) — « protéger le forward ».
  # Contrairement à nginx (→ 5151 en CLAIR : TLS terminé, lien interne de
  # confiance d'un même datacenter), haproxy RE-CHIFFRE vers le port HTTPS/2
  # (5152). C'est le cas où le proxy/PoP est AILLEURS dans le réseau : le trafic
  # proxy→Nodefony retraverse un segment potentiellement non sûr → il ne doit
  # JAMAIS y circuler en clair. Nodefony joint par son NOM DE DOMAINE
  # (nodefony.com → host-gateway via extra_hosts). Bind serveur 0.0.0.0 requis.
  #
  # ⚠️⚠️ CHAÎNE DE CERTIFICATION — À NE PAS OUBLIER (cf README §TLS du forward).
  # `verify none` DÉSACTIVE la validation du cert backend → DEV UNIQUEMENT. Le
  # cert auto-signé Nodefony (dev) a CN=localhost (cf `certificates` dans
  # nodefony.config.ts) : il ne matche ni `nodefony.com` ni une CA de confiance.
  # En conditions RÉELLES `verify none` rend la protection ILLUSOIRE (MITM
  # possible sur le lien re-encrypt). Banc complet à faire :
  #   1) cert backend avec SAN=nodefony.com ;
  #   2) `ca-file /etc/haproxy/ca.pem verify required` (fournir la CA) ;
  #   3) `sni str(nodefony.com)` (que Nodefony présente le bon cert).
  server nodefony nodefony.com:5152 check ssl verify none
