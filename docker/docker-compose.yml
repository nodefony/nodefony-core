# Nodefony — infra de développement (Realtime distribué P13 + Log Backplane prod LB.4)
#
# Pourquoi ce fichier : deux besoins d'infra externe se rejoignent ici.
#   1. La « Socket Nodefony » distribuée (RedisBackplane, KafkaBackplane) a besoin d'un
#      Redis (fan-out pub/sub cross-host) et plus tard d'un Kafka (bus events persistant).
#   2. Le Log Backplane (LB.4) sait pousser/relire les logs dans des destinations prod :
#      Loki (push HTTP + LogQL, léger) et OpenSearch (recherche full-text). On les démarre
#      en local pour développer et tester les drivers `loki` / `opensearch`.
#
# Réseau : à partir de 2 services, tout vit sur UN bridge nommé `nodefony-net` (section
# `networks` en bas). Les conteneurs se résolvent entre eux par leur NOM de service via le
# DNS interne Docker (`grafana` → `http://loki:3100`, `dashboards` → `http://opensearch:9200`)
# — JAMAIS `localhost` côté conteneur. Les ports ne sont publiés que sur `127.0.0.1` : l'app
# Nodefony tourne sur l'HÔTE (hors Docker pour l'instant) et accède via `127.0.0.1:<port>`.
#
# Usage (activation progressive par profils — rien n'est lancé « au cas où ») :
#   docker compose -f docker/docker-compose.yml up -d                     # Redis seul (défaut)
#   docker compose -f docker/docker-compose.yml --profile kafka up -d     # + Kafka
#   docker compose -f docker/docker-compose.yml --profile tools up -d     # + RedisInsight (UI)
#   docker compose -f docker/docker-compose.yml --profile loki up -d      # + Loki + Grafana (logs)
#   docker compose -f docker/docker-compose.yml --profile opensearch up -d# + OpenSearch + Dashboards
#   docker compose -f docker/docker-compose.yml --profile loki --profile opensearch up -d
#   docker compose -f docker/docker-compose.yml --profile proxy up -d     # + nginx + haproxy (test forwarded)
#   docker compose -f docker/docker-compose.yml --profile browser up -d   # + navigateur jetable (observer l'UI)
#   docker compose -f docker/docker-compose.yml down                      # arrêt (volumes conservés)
#   docker compose -f docker/docker-compose.yml down -v                   # arrêt + purge données
#
# Config : chaque valeur (ports, mot de passe dev) a un défaut inline `${VAR:-défaut}` →
# AUCUN fichier .env requis en dev. Pour surcharger (vrai secret, autre port) : `export VAR=…`
# avant le `up`, ou déposer un `docker/.env` (lu automatiquement par compose, ignoré par git).
# Les défauts dev (`nodefony-dev`, `Nodefony-dev-2026!`) sont publics — JAMAIS en prod.

name: nodefony-dev

services:
  # --- Redis (Bloc B — fan-out pub/sub du RealtimeHub distribué) ---
  # Single instance volontaire : le backplane utilise PUB/SUB, qui fonctionne en standalone.
  # Le « cluster » Nodefony = N process Node (pods), PAS du sharding Redis Cluster 6-nodes.
  redis:
    image: redis:7-alpine
    container_name: nodefony-redis
    restart: unless-stopped
    networks: [nodefony]
    # requirepass : auth obligatoire (Zero Trust, même en dev). appendonly : persistance AOF
    # (survit au restart du conteneur) sans le coût d'un RDB snapshot bloquant.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nodefony-dev}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      # Exposé sur localhost uniquement (pas 0.0.0.0) — surface réseau minimale en dev.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # -a : redis-cli s'authentifie sinon PING renvoie NOAUTH. Le conteneur est « healthy »
      # seulement quand Redis répond PONG → les dépendants peuvent attendre dessus.
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-nodefony-dev} ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- PostgreSQL (profile postgres — portabilité multi-dialecte de l'adapter Drizzle) ---
  # Cible des bancs e2e cross-pod du DrizzleIdempotencyStore : l'atomicité de
  # `INSERT … ON CONFLICT DO UPDATE … WHERE` entre connexions CONCURRENTES (vrai
  # serveur multi-clients), que SQLite (fichier mono-machine) ne peut pas prouver.
  # Démarrage : `docker compose -f docker/docker-compose.yml --profile postgres up -d postgres`
  postgres:
    image: postgres:16-alpine
    container_name: nodefony-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    networks: [nodefony]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodefony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodefony-dev}
      POSTGRES_DB: ${POSTGRES_DB:-nodefony}
    ports:
      # Loopback uniquement (surface réseau minimale en dev).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nodefony} -d ${POSTGRES_DB:-nodefony}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- MongoDB (profile mongo — l'autre NATURE de store, pas un dialecte de plus) ---
  # L'adapter mongoose ne se prouve pas sur SQL : documents, opérateurs `$`, et
  # surtout des TRANSACTIONS qui exigent un replica set (Mongo refuse les sessions
  # transactionnelles en standalone). D'où `--replSet` + l'initiation au
  # healthcheck : sans lui, le serveur répond mais les bancs de transaction
  # échoueraient sur un message qui ne parle pas du décor.
  #
  # Sans ce service, la suite retombe sur un `mongod` téléchargé à la volée
  # (mongodb-memory-server) — indisponible hors ligne, et son échec SKIPPE les
  # bancs sans rien casser : 146 tests peuvent rester muets en affichant du vert.
  # Démarrage :
  #   `docker compose -f docker/docker-compose.yml --profile mongo up -d mongo`
  mongo:
    image: mongo:8
    container_name: nodefony-mongo
    restart: unless-stopped
    networks: [nodefony]
    command: ["--replSet", "${MONGO_REPLSET:-rs0}", "--bind_ip_all"]
    ports:
      # Exposé sur localhost uniquement (pas 0.0.0.0) — surface réseau minimale en dev.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    profiles: ["mongo"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initie le replica set au premier passage puis vérifie qu'il répond. Idempotent :
      # `rs.status()` réussit une fois initié, l'initiation n'a lieu qu'au premier tour.
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({_id:"${MONGO_REPLSET:-rs0}",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok }'' | grep -q 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # --- MariaDB (profile mariadb — portabilité multi-dialecte de l'adapter Drizzle) ---
  # Fork LIBRE de MySQL (choix projet : logiciel libre) — même protocole, même
  # driver `mysql2`, même dialecte drizzle `mysql`. Cible des e2e S4 : les 8
  # briques framework sur le 3ᵉ dialecte (spécificités `ON DUPLICATE KEY
  # UPDATE`, absence de RETURNING niveau plus petit dénominateur, sentinel
  # OFFSET). Démarrage :
  #   `docker compose -f docker/docker-compose.yml --profile mariadb up -d mariadb`
  mariadb:
    image: mariadb:11.4
    container_name: nodefony-mariadb
    restart: unless-stopped
    profiles: ["mariadb"]
    networks: [nodefony]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-nodefony-dev}
      MARIADB_USER: ${MARIADB_USER:-nodefony}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-nodefony-dev}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nodefony}
    ports:
      # Loopback uniquement (surface réseau minimale en dev).
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh = outil officiel de l'image mariadb.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- MySQL (profile mysql — PREUVE DE COMPAT du dialecte, port 3307) ---
  # Le quotidien libre = mariadb (ci-dessus) ; ce service ne sert qu'à prouver
  # que le dialecte `mysql` de l'adapter tourne AUSSI sur MySQL Community
  # (mêmes e2e, autre port) : NF_MYSQL_URL=mysql://…@127.0.0.1:3307/nodefony
  # Démarrage : `docker compose -f docker/docker-compose.yml --profile mysql up -d mysql`
  mysql:
    image: mysql:8.4
    container_name: nodefony-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    networks: [nodefony]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nodefony-dev}
      MYSQL_USER: ${MYSQL_USER:-nodefony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nodefony-dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nodefony}
    ports:
      # Loopback uniquement ; 3307 pour cohabiter avec mariadb (3306).
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-nodefony} -p${MYSQL_PASSWORD:-nodefony-dev} --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- RedisInsight (profile tools — UI de debug, jamais en prod) ---
  redisinsight:
    image: redis/redisinsight:latest
    container_name: nodefony-redisinsight
    restart: unless-stopped
    profiles: ["tools"]
    networks: [nodefony]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy

  # --- Kafka (profile kafka — Bloc C, bus events IA-ready) ---
  # KRaft mode (PAS de Zookeeper) : Zookeeper est déprécié depuis Kafka 3.5 et retiré en 4.0.
  # KRaft = 1 conteneur self-managed au lieu de 2 → moins de surface, démarrage plus rapide.
  kafka:
    image: apache/kafka:3.9.0
    container_name: nodefony-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    networks: [nodefony]
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      # Node combiné broker + controller (single-node KRaft pour le dev).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node : pas de réplication possible → tout à 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Loki (profile loki — destination de logs LB.4, driver `loki`) ---
  # Léger : Loki indexe les LABELS (basse cardinalité), pas le contenu full-text → peu de RAM.
  # L'image embarque /etc/loki/local-config.yaml (single-binary, stockage filesystem boltdb) →
  # démarre sans config externe. Le driver Nodefony pousse sur /loki/api/v1/push (JSON, ts en ns)
  # et relit via LogQL sur /loki/api/v1/query_range. requestId = champ de la ligne JSON (PAS un
  # label → on n'explose pas l'index), filtré côté driver après rapatriement.
  loki:
    image: grafana/loki:3.7.2
    container_name: nodefony-loki
    restart: unless-stopped
    profiles: ["loki"]
    networks: [nodefony]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    # PAS de healthcheck : l'image grafana/loki est DISTROLESS (aucun /bin/sh, ni wget,
    # ni curl) → un healthcheck Docker (qui exec DANS le conteneur) échouerait à vie et
    # marquerait Loki « unhealthy » à tort. Sondage de santé = côté HÔTE
    # (`curl http://127.0.0.1:3100/ready`) ou via le driver Nodefony (ping backplane).

  # --- Grafana (profile loki — UI de visualisation des logs Loki, dev-only) ---
  # Datasource Loki auto-provisionnée (docker/grafana/provisioning) → ouvre sur Loki prêt,
  # 0 setup manuel. Anonyme + rôle Admin pour un dev sans friction (JAMAIS en prod).
  grafana:
    image: grafana/grafana:latest
    container_name: nodefony-grafana
    restart: unless-stopped
    profiles: ["loki"]
    networks: [nodefony]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-nodefony-dev}
      # Pas de télémétrie ni de check de mise à jour en dev local.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisioning en lecture seule (DNS interne : la datasource pointe http://loki:3100).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      # service_started (pas service_healthy) : Loki est distroless = pas de healthcheck
      # (cf service loki). Grafana retente sa datasource seul jusqu'à ce que Loki réponde.
      loki:
        condition: service_started

  # --- OpenSearch (profile opensearch — destination de logs LB.4, driver `opensearch`) ---
  # Single-node. Plugin de sécurité DÉSACTIVÉ en dev (DISABLE_SECURITY_PLUGIN=true) → HTTP simple
  # sur :9200 sans TLS ni auth = driver trivial à brancher. En PROD on réactive (TLS + admin pwd).
  # Heap bridé à 512m (défaut 1g trop lourd pour une station de dev). memory_lock évite le swap.
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: nodefony-opensearch
    restart: unless-stopped
    profiles: ["opensearch"]
    networks: [nodefony]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Requis 2.12+ même si le plugin est désactivé (validé au boot avant le disable).
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Nodefony-dev-2026!}
    ulimits:
      # memory_lock nécessite des ulimits memlock illimités côté conteneur.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Sécurité désactivée → HTTP simple, pas d'auth. L'image fournit curl.
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- OpenSearch Dashboards (profile opensearch — UI Kibana-like, dev-only) ---
  # Version ALIGNÉE sur opensearch (3.5.0). Sécurité désactivée pour matcher le cluster HTTP.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: nodefony-opensearch-dashboards
    restart: unless-stopped
    profiles: ["opensearch"]
    networks: [nodefony]
    environment:
      # DNS interne : cible le service `opensearch`, pas localhost.
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # --- nginx (profile proxy — banc reverse-proxy, X-Forwarded-* de-facto) ---
  # Valide la résolution forwarded + l'IP cliente FROM-RIGHT du serveur
  # (extractClientIp, anti-spoof). Nodefony tourne sur l'HÔTE → joint via
  # host.docker.internal (extra_hosts host-gateway = portable Linux/macOS).
  # ⚠️ Prérequis : `trustProxy` doit couvrir l'IP de la gateway Docker vue par
  # le serveur (cf README — sinon X-Forwarded-* ignorés et IP = la gateway).
  nginx:
    image: nginx:1.27-alpine
    container_name: nodefony-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    networks: [nodefony]
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Le banc parle de Nodefony par son NOM DE DOMAINE : `nodefony.com` résout
      # vers l'hôte (= host-gateway) DANS le conteneur, comme `/etc/hosts` côté
      # hôte le fait pour le client. Upstream + Host transmis = nodefony.com.
      - "nodefony.com:host-gateway"

  # --- haproxy (profile proxy — banc reverse-proxy, Forwarded RFC 7239 + TLS) ---
  # Pose le header STANDARD `Forwarded` (RFC 7239) + X-Forwarded-*, et re-chiffre
  # vers le backend 5152 avec validation COMPLÈTE (verify required + verifyhost +
  # sni). Frontend :8081 (clair, proto=http) + :8443 (TLS, proto=https E2E).
  # ⚠️ Avant `up` : NF_BIND_ALL=1 (cert SAN=nodefony.com) puis
  #    `bash docker/certs/build-haproxy-pem.sh` (génère certs/{ca,haproxy}.pem).
  haproxy:
    image: haproxy:3.0-alpine
    container_name: nodefony-haproxy
    restart: unless-stopped
    profiles: ["proxy"]
    networks: [nodefony]
    ports:
      - "127.0.0.1:${HAPROXY_PORT:-8081}:8081"
      - "127.0.0.1:${HAPROXY_TLS_PORT:-8443}:8443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # ca.pem (verify required) + haproxy.pem (cert présenté au client). Générés
      # par build-haproxy-pem.sh à partir des certs Nodefony (gitignorés).
      - ./certs:/etc/haproxy/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Idem nginx : Nodefony joignable par son nom de domaine dans le conteneur.
      - "nodefony.com:host-gateway"

  # --- browser (profile browser — OBSERVER l'UI, sans Chromium sur le poste) ---
  #
  # POURQUOI ce service existe. Vérifier une page se faisait jusqu'ici en deux temps :
  # `curl` pour le backend, puis demander au développeur de regarder son navigateur
  # pour le rendu. Le chaînon manquant — lire la console, l'arbre d'accessibilité et
  # les requêtes réelles d'une page — imposait un Chromium headless SUR le poste, ce
  # qui a déjà figé la machine (règle `feedback_no_headless_chrome`, qui prévoyait
  # explicitement l'exception : accord du développeur + ENVIRONNEMENT ISOLÉ). Ce
  # conteneur EST cet environnement : borné en CPU/RAM, jetable, tué d'un `down`.
  #
  # ⚠️ Ce service n'est PAS celui que pilote l'extension MCP de l'éditeur — celle-ci
  # lance son propre conteneur, à la demande, avec ses propres options. Les deux
  # coexistent sans se voir. L'intérêt PROPRE de celui-ci : il est déclaré (donc
  # reproductible), et son `--output-dir` est monté sur l'hôte — les captures et les
  # journaux SORTENT du conteneur, ce que la variante à la demande ne permet pas.
  #
  # Parler à Nodefony depuis ce conteneur : `http://host.docker.internal:5151` (ou
  # `https://…:5152`). JAMAIS `localhost` — dans un conteneur ce nom le désigne LUI.
  # Deux prérequis côté application, sinon la page reste blanche ou refusée :
  #   1. `trustedHosts` doit contenir `host.docker.internal` (posé en dev dans
  #      `nodefony.config.ts`) — sinon la barrière Host répond `421`, réseau OK.
  #   2. `NF_STUDIO_UI=static` pour observer Studio : en mode Vite, la page annonce
  #      ses assets en `https://127.0.0.1:5173` — ce `127.0.0.1` est celui du
  #      NAVIGATEUR, donc du conteneur, qui n'héberge aucun Vite. Le pourquoi complet
  #      est dans `env.ts`. Le HMR joignable en conteneur reste un chantier ouvert.
  #
  # Usage :
  #   docker compose -f docker/docker-compose.yml --profile browser up -d
  #   # → serveur MCP en SSE sur 127.0.0.1:3001, captures dans tmp/browser/
  browser:
    # Épinglée par DIGEST : cette image n'est pas taguée localement, et un `latest`
    # mouvant sous un banc d'observation ferait varier le rendu sans qu'on le sache.
    image: mcp/playwright@sha256:097d978439237cc9b12e10825836a97245add2be0479272cce9d98c368f024d1
    container_name: nodefony-browser
    restart: unless-stopped
    profiles: ["browser"]
    networks: [nodefony]
    ports:
      - "127.0.0.1:${BROWSER_PORT:-3001}:3000"
    # L'ENTRYPOINT de l'image fixe déjà `--headless --browser chromium --no-sandbox`.
    # On ne le remplace pas : on COMPLÈTE par la commande, qui lui est concaténée.
    command:
      # Transport SSE : sans `--port`, le serveur parle en stdio et un service
      # long-running n'aurait personne au bout.
      - "--port=3000"
      # Bind toutes interfaces DANS le conteneur — le défaut `localhost` ne serait
      # pas atteignable depuis l'hôte, même avec la publication de port ci-dessus.
      - "--host=0.0.0.0"
      # Le port est publié sur 127.0.0.1 uniquement : la vérification d'hôte de
      # Playwright ferait doublon et refuserait l'accès par le nom du service.
      - "--allowed-hosts=*"
      # Certificat de développement auto-signé (5152, généré par Nodefony) : sans
      # ceci, toute navigation HTTPS échoue avant d'avoir rendu quoi que ce soit.
      # Acceptable ICI parce que ce conteneur ne sert qu'à observer du localhost.
      - "--ignore-https-errors"
      # Captures, journaux console et réseau écrits en FICHIERS dans le volume
      # ci-dessous → récupérables sur l'hôte. C'est l'apport de ce service.
      - "--output-dir=/output"
      - "--output-mode=file"
      # Profil en mémoire : rien n'est écrit sur le disque du conteneur, et un
      # `down` efface l'état d'authentification avec lui.
      - "--isolated"
      # UN SEUL contexte de navigation pour tous les clients connectés : une session
      # ouverte dans un script reste ouverte pour le suivant (vérifié — un client
      # neuf retrouve la page authentifiée sans repasser par la connexion). Sans
      # cette option chaque client repart d'un contexte vierge, donc déconnecté.
      # Compromis assumé : ce conteneur sert à OBSERVER, pas à paralléliser des
      # tests, où un état partagé serait au contraire une source de faux verdicts.
      - "--shared-browser-context"
      - "--viewport-size=1440x900"
    volumes:
      # `tmp/` est gitignoré — les captures sont des PHOTOS, jamais du versionné.
      - ../tmp/browser:/output
    # Le répertoire courant, PAS seulement `--output-dir`. Vérifié en exerçant le
    # service : `--output-dir` gouverne les instantanés, la console et le réseau,
    # mais une capture demandée sous un nom relatif (`./page.png`) est résolue par
    # Playwright contre le RÉPERTOIRE COURANT — elle restait donc dans `/home/node`,
    # invisible de l'hôte, pendant que l'appel répondait « OK ». Aligner le courant
    # sur le volume fait tout sortir par la même porte.
    working_dir: /output
    extra_hosts:
      # Le nom par lequel le conteneur joint l'application qui tourne sur l'hôte.
      - "host.docker.internal:host-gateway"
      # Cohérent avec nginx/haproxy : accès par nom de domaine (cert SAN NF_BIND_ALL).
      - "nodefony.com:host-gateway"
    # Précaution, NON éprouvée ici : le `/dev/shm` par défaut de Docker (64 Mo) est
    # connu pour faire mourir un onglet Chromium sans message sur une page lourde.
    # Les pages observées jusqu'ici sont légères — si on la retire un jour, c'est ce
    # symptôme-là qu'il faudra reconnaître.
    shm_size: "1gb"
    # Bornes de ressources : c'est ce qui rend le mot « isolé » vérifiable. Un
    # navigateur emballé ne peut plus prendre la machine, il se fait tuer.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

# Réseau unique de l'infra dev. Bridge nommé explicitement (`nodefony-net`) → résolution DNS
# par nom de service entre conteneurs, isolation vis-à-vis du bridge `default` de Docker, et
# nettoyage propre au `down`.
#
# Sous-réseau IPAM ÉPINGLÉ (`172.28.0.0/16`) → plage REPRODUCTIBLE : l'adressage ne dépend plus
# de l'ordre d'allocation Docker (qui part de 172.17 et remonte), donc stable d'un `up` à l'autre
# et d'une machine à l'autre — nécessaire pour raisonner sur le réseau et poser des IP fixes si
# besoin. `172.28` est choisi HAUT dans la plage privée Docker : l'auto-allocation commence bas,
# elle n'y arrive qu'avec beaucoup de réseaux → collision improbable.
# ⚠️ Compromis assumé : figer retire le garde-fou anti-collision. Si un AUTRE projet Compose a déjà
# pris 172.28.0.0/16, le `up` échoue (« Pool overlaps »). Le cas échéant : changer ce seul bloc
# (ex. 172.29/172.30) — jamais publier sur 0.0.0.0, les ports restent sur 127.0.0.1 (cf services).
# macvlan / IP LAN réelle (192.168.x) = hors-sujet ici (host↔conteneur bloqué, WiFi KO, conflit DHCP).
networks:
  nodefony:
    name: nodefony-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis-data:
  mongo-data:
  postgres-data:
  mariadb-data:
  mysql-data:
  kafka-data:
  loki-data:
  grafana-data:
  opensearch-data:
