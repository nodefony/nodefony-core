# nginx — proxy de test pour Nodefony (en-têtes X-Forwarded-* de-facto).
#
# Objectif du banc : exercer la résolution d'IP cliente FROM-RIGHT du serveur
# (cf extractClientIp dans @nodefony/http) + démontrer l'offload des fichiers
# statiques. Le serveur Nodefony tourne sur l'HÔTE (port 5151) ; nginx le joint
# via host.docker.internal.
#
# Refs : RFC 7239 (Forwarded) §8.1 (confiance), X-Forwarded-* (de-facto).

worker_processes 1;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Upgrade WebSocket — Nodefony co-héberge HTTP + WS sur le même port (5151).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream nodefony {
    server host.docker.internal:5151;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    # =====================================================================
    # OFFLOAD STATIQUES — NON branché ici volontairement.
    # Nodefony sert PLUSIEURS répertoires `public/` : la racine app + UN par
    # module (au boot : `/public` ET `/src/modules/test/public`, etc.). Un seul
    # volume `../public` raterait les statiques des modules → ce serait un trou.
    # La résolution correcte (montages + `location` par module + domaines) doit
    # être DÉRIVÉE de l'introspection Nodefony → c'est le rôle du futur
    # générateur de config proxy CLI (`nodefony proxy:generate nginx|haproxy`).
    # En attendant, nginx proxifie TOUT vers le serveur (statics inclus) ; pour
    # désactiver le service statique côté serveur : `static.enabled = false`.
    # =====================================================================

    location / {
      proxy_pass http://nodefony;
      proxy_http_version 1.1;

      # ---- En-têtes forwarded -------------------------------------------
      # X-Forwarded-For : $proxy_add_x_forwarded_for APPEND l'IP réelle du
      # client ($remote_addr) à la chaîne entrante. C'est le comportement d'un
      # proxy INTERNE : il PRÉSERVE un X-Forwarded-For amont — donc une valeur
      # FORGÉE par le client reste dans la chaîne (à gauche). C'est VOULU ici :
      # ça exerce le dépouillement from-right du serveur (extractClientIp), qui
      # doit renvoyer l'IP réelle (à droite) et jamais la forgée (à gauche).
      #
      # ⚠️ BONNE PRATIQUE EDGE (proxy de BORDURE, face à Internet) : ne JAMAIS
      # préserver le X-Forwarded-For client → l'ÉCRASER avec l'IP réelle :
      #     proxy_set_header X-Forwarded-For $remote_addr;
      # (ou module real_ip + set_real_ip_from pour dépouiller des proxies amont
      #  explicitement déclarés). RFC 7239 §8.1 : la chaîne entrante n'est pas
      #  fiable tant qu'aucun maillon de confiance ne l'a réécrite.
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  $server_port;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Host              $host;

      # WebSocket
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
