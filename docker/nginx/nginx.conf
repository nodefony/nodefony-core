# nginx — proxy de test pour Nodefony (en-têtes X-Forwarded-* de-facto).
#
# Objectif du banc : exercer la résolution d'IP cliente FROM-RIGHT du serveur
# (cf extractClientIp dans @nodefony/http) + démontrer l'offload des fichiers
# statiques. Le serveur Nodefony tourne sur l'HÔTE (port 5151) ; nginx le joint
# via host.docker.internal.
#
# Refs : RFC 7239 (Forwarded) §8.1 (confiance), X-Forwarded-* (de-facto).

worker_processes 1;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Upgrade WebSocket — Nodefony co-héberge HTTP + WS sur le même port (5151).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Nodefony joint par son NOM DE DOMAINE (nodefony.com → host-gateway via
  # extra_hosts du compose). Le serveur sur l'hôte doit BINDER une IP joignable
  # depuis Docker (domain 0.0.0.0) — pas 127.0.0.1 (défaut dev, injoignable).
  #
  # LIEN DE FORWARD EN CLAIR (port HTTP 5151) : ce banc nginx illustre le TLS
  # terminé au proxy + lien interne de CONFIANCE (même datacenter). Le pendant
  # « lien protégé » (re-encrypt vers 5152) est exercé par haproxy — cf README
  # §TLS du forward + le problème de chaîne de certification.
  upstream nodefony {
    server nodefony.com:5151;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name nodefony.com;

    # =====================================================================
    # OFFLOAD STATIQUES — NON branché ici volontairement.
    # Nodefony sert PLUSIEURS répertoires `public/` : la racine app + UN par
    # module (au boot : `/public` ET `/src/modules/test/public`, etc.). Un seul
    # volume `../public` raterait les statiques des modules → ce serait un trou.
    # La résolution correcte (montages + `location` par module + domaines) doit
    # être DÉRIVÉE de l'introspection Nodefony → c'est le rôle du futur
    # générateur de config proxy CLI (`nodefony proxy:generate nginx|haproxy`).
    # En attendant, nginx proxifie TOUT vers le serveur (statics inclus) ; pour
    # désactiver le service statique côté serveur : `static.enabled = false`.
    # =====================================================================

    location / {
      proxy_pass http://nodefony;
      proxy_http_version 1.1;

      # ---- En-têtes forwarded -------------------------------------------
      # EDGE (proxy de BORDURE, face au client) : on ÉCRASE X-Forwarded-For avec
      # la SEULE IP réelle vue par nginx ($remote_addr) → toute valeur FORGÉE par
      # le client (`X-Forwarded-For: 6.6.6.6`) est JETÉE. RFC 7239 §8.1 : la
      # chaîne entrante n'est pas fiable tant qu'un maillon de confiance ne l'a
      # pas réécrite ; un edge ne préserve JAMAIS le XFF client.
      #
      # ⚠️ NE PAS utiliser `$proxy_add_x_forwarded_for` ICI (il APPEND, donc
      # PRÉSERVE le XFF forgé à gauche). Réservé aux proxies INTERNES qui
      # prolongent une chaîne déjà fiable. Dans ce banc local, le « vrai client »
      # (curl hôte) apparaît comme la gateway Docker — elle-même dans la plage de
      # confiance (`uniquelocal`) → en mode append, le from-right dépouille
      # jusqu'à la valeur forgée. Le from-right multi-proxy est exercé séparément
      # (tests unit + requêtes directes `Forwarded:` multi-`for`).
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  $server_port;
      proxy_set_header X-Real-IP         $remote_addr;
      # Host forcé sur le domaine canonique → le banc teste TOUJOURS le vhost
      # nodefony.com (déterministe, que le client tape nodefony.com:8080 ou
      # 127.0.0.1:8080). Doit figurer dans http.trustedHosts (sinon 401).
      proxy_set_header Host              nodefony.com;

      # WebSocket
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
