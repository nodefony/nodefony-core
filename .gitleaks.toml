# Configuration gitleaks du dépôt — le scan de secrets de l'intégration continue.
#
# 🔴 Pourquoi une liste d'exceptions EXISTE, et pourquoi elle est NOMINATIVE.
# Un dépôt de framework contient légitimement des chaînes qui RESSEMBLENT à des
# secrets : les jetons d'exemple des normes qu'il implémente, les vecteurs de
# test d'un standard, les mots de passe d'un décor jetable. Sans exceptions, le
# gate crie au premier run — et un gate qui crie faux se fait désactiver, ce qui
# est pire que pas de gate du tout.
#
# La règle : **on n'exclut jamais un dossier pour se débarrasser d'une alerte.**
# On nomme la valeur, avec le motif qui la rend légitime. Un dossier exclu avale
# les vrais secrets qu'on y déposera demain. La seule exception est le corpus de
# NORMES embarqué hors ligne : ce sont les RFC elles-mêmes, on ne les édite pas,
# et elles portent les jetons d'exemple de leurs propres sections d'exemple.
#
# Un finding DÉJÀ commité et acquitté ne vit PAS ici : il vit dans
# `.gitleaksignore`, par son empreinte exacte (`commit:fichier:règle:ligne`).
# La différence n'est pas cosmétique — une règle de ce fichier vaut pour tout ce
# qui lui ressemblera demain, une empreinte ne vaut que pour UN finding.
#
# Rejouer à la main (les deux, l'un ne remplace pas l'autre) :
#   gitleaks git . --config .gitleaks.toml --no-banner --exit-code 1
#   gitleaks dir . --config .gitleaks.toml --no-banner --exit-code 1
# ⚠️ `dir` sur un poste lit AUSSI `node_modules` (des minutes) ; en forge le
# checkout est nu, et c'est là que ce scan a du sens.

[extend]
useDefault = true

[allowlist]
description = "Ce qui n'est pas un secret dans ce dépôt"

paths = [
  # Artefacts non versionnés — ils n'entrent jamais dans un commit.
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.vitest/''',
  '''(^|/)tmp/''',
  '''(^|/)var/''',
  '''(^|/)release/tarballs/''',
  '''(^|/)package-lock\.json$''',
  # Le corpus de NORMES embarqué hors ligne (RFC IETF, specs W3C, docs Node) :
  # 35 des 50 trouvailles du premier scan venaient de là. Ce sont les textes
  # normatifs eux-mêmes, jamais du code de ce dépôt.
  '''\.claude/skills/[^/]+/reference[s]?/rfc/''',
  '''\.claude/skills/nodefony-rfc/references/''',
  # Le certificat de DÉVELOPPEMENT du framework (mkcert). Sa clé privée est
  # dans le dépôt à dessein : elle n'est signée que par une autorité locale, de
  # confiance sur la seule machine qui l'a créée — elle ne protège rien
  # ailleurs, et une application réelle régénère la sienne
  # (`npx nodefony http:certificates`). L'exclusion est NOMINATIVE : tout autre
  # `.pem` du dépôt reste surveillé.
  '''src/packages/@nodefony/http/nodefony/config/certificates/''',
]

regexes = [
  # Vecteurs de test de normes — publiés DANS la norme, sans quoi on ne peut
  # pas prouver l'implémentation. RFC 6238 (TOTP), annexe B.
  '''GEZDGNBVGY3TQOJQ''',
  '''12345678901234567890''',
  # Mots de passe des DÉCORS jetables (banc devkit, banc multipod) : ils
  # désignent des conteneurs liés à 127.0.0.1, détruits à la fin du run.
  '''(TemoinPassw0rd42x|SondePassw0rd42x|AncienPassw0rd42x)''',
  '''bench-secret-0123456789abcdefghij''',
  '''(app-dev|nodefony-dev|banc-verite-admin|changeme)''',
  # Jeton JOUET du contrôle d'isolation du décor : sa charge utile est le texte
  # « jeton-du-depot », il n'est signé par rien.
  '''eyJhbGciOiJFZERTQSJ9\.jeton-du-depot''',
  # Secrets de webhook des tests unitaires de `@nodefony/security` : le préfixe
  # `whsec_` est celui de la convention Stripe, et ces deux valeurs ne signent
  # que des charges utiles fabriquées dans le test.
  '''whsec_(dGVzdHNlY3JldA==|MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw)''',
  # Clé de chiffrement du test de rédaction : sa raison d'être est d'être
  # AFFICHÉE puis vérifiée masquée dans la sortie.
  '''B\+rvSlBo1nEunwaBryX0qP45=''',
  # Clés d'idempotence d'exemple dans la documentation. Une clé d'idempotence
  # n'est PAS un secret : elle est choisie par le client et voyage en clair dans
  # l'en-tête. Ce sont les deux UUID écrits dans `framework/docs/idempotence.md`
  # — nommés, parce qu'exclure « tout UUID » aveuglerait le scanner sur une vraie
  # clé qui aurait cette forme.
  '''3f6a9c1e-2b7d-4a10-9d31-8e5c2f0a7b64''',
  '''3f6a9c1e-8b2d-4e17-b0aa-2c9f7e1d4a55''',
]
