<!doctype html>
<!--
  `lang` déclare la langue du CONTENU, pas celle du code : l'interface de Studio
  est rédigée en français, et un `lang="en"` fait lire l'écran par une voix
  anglaise au lecteur d'écran. Aucun audit ne l'a signalé — `html-has-lang` ne
  vérifie que la PRÉSENCE de l'attribut, jamais sa justesse.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Nodefony Studio</title>
    <!-- Décrit la page aux moteurs ET aux agents : c'est la première phrase
         qu'un modèle lit pour savoir sur quoi il vient d'atterrir. -->
    <meta
      name="description"
      content="Console d'administration de Nodefony — supervision temps réel, journaux, modules, routes, base de données et sécurité d'une application Nodefony."
    />
    <!-- favicon inline (hexagone brand #0067ba) — sans lui le navigateur
         demande /favicon.ico → 404 dans la console à chaque page Studio -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l6 3.5v7L8 15l-6-3.5v-7z' fill='%230067ba'/%3E%3Ctext x='8' y='11.5' font-size='8' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
