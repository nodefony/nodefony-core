# TypeScript des contrats gRPC du module `test` (ADR-0026 D2) : `npx buf generate`
# depuis ce dossier. Le code généré est COMMITÉ, jamais édité ; la CI refuse la
# dérive (`scripts/gates/check-generated-protobuf.mjs`).
version: v2
inputs:
  - directory: proto
  # Suite de conformité officielle de Connect (#695), version ÉPINGLÉE — la
  # même que le binaire `connectconformance` (`conformance/run.mjs`).
  - git_repo: https://github.com/connectrpc/conformance.git
    tag: v1.0.7
    subdir: proto
    paths:
      - connectrpc/conformance/v1/config.proto
      - connectrpc/conformance/v1/server_compat.proto
      - connectrpc/conformance/v1/service.proto
plugins:
  - local: protoc-gen-es
    out: nodefony/gen
    opt: target=ts
