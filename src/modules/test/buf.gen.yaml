# TypeScript des contrats gRPC du module `test` (ADR-0026 D2) : `npx buf generate`
# depuis ce dossier. Le code généré est COMMITÉ, jamais édité ; la CI refuse la
# dérive (`scripts/gates/check-generated-protobuf.mjs`).
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: nodefony/gen
    opt: target=ts
